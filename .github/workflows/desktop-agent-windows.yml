name: Desktop Agent Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: desktop-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download FFmpeg for bundling
        run: npx tsx scripts/src/download-ffmpeg.ts

      - name: Build Windows installer
        run: pnpm --filter @workspace/desktop-agent run build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-desktop-agent-windows
          path: artifacts/desktop-agent/dist-bundle/Tandem Desktop Agent Setup 0.0.1.exe
