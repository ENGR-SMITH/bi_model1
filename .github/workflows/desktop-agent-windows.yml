# Artifact-only Windows build — runs on every push to main so a broken build
# surfaces early. It deliberately does NOT publish: the installer the in-app
# "Desktop agent" button serves comes from build-desktop-agent.yml (tag
# agent-v*, or a manual dispatch), which is also the workflow that writes
# latest.yml. Running THIS one does not change what users download.
name: Desktop Agent Windows Build (artifact only)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: desktop-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm must exist BEFORE actions/setup-node runs: `cache: pnpm` resolves
      # the pnpm binary to compute the store path, and without it the step dies
      # with "Unable to locate executable file: pnpm" — which is what failed
      # every run of this workflow.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same stamping as build-desktop-agent.yml: electron-updater ignores
      # builds whose version isn't newer, and the artifact filename embeds the
      # version, so every run must produce a higher one.
      - name: Stamp build version from run number
        run: |
          node -e "
            const fs = require('fs');
            const file = 'artifacts/desktop-agent/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = '0.0.' + (100 + Number(process.env.GITHUB_RUN_NUMBER || 0));
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log('stamped build version →', pkg.version);
          "

      - name: Download FFmpeg for bundling
        run: pnpm --filter @workspace/scripts exec tsx src/download-ffmpeg.ts

      - name: Build Windows installer
        run: pnpm --filter @workspace/desktop-agent run build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexet-desktop-agent-windows
          path: artifacts/desktop-agent/dist-bundle/*.exe
