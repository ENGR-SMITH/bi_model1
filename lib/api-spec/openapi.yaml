      responses:
        "200":
          description: Ticket status and active passes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketStatus" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /tickets/promo/validate:
    post:
      operationId: validateTicketPromo
      tags: [tandems]
      summary: Validate a promo code for the ticket checkout
      description: Live promo-code check for the coupon card — returns the discount and the discounted pass price (or valid:false for an unknown/expired/used-up code).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPromoValidateInput" }
      responses:
        "200":
          description: Promo validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPromoValidateResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /tickets/purchase:
    post:
      operationId: purchaseTicket
      tags: [tandems]
      summary: Buy a category pass with a credit card
      description: Validates the card (Luhn, expiry, cvc) and optional promo code, then grants or extends the 3-week pass for the category. Card details are validated in-house today (only the last-4 is kept); a Stripe Checkout session will replace this once keys are added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketPurchaseInput" }
      responses:
        "201":
          description: Purchased pass with receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPurchaseResponse" }
        "400":
          description: Invalid card, category, or promo code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects:
    get:
      operationId: listVideoProjects
      tags: [content-creators]
      summary: List the authenticated user's content-creation projects
      description: Returns the projects the user owns or is a member of. When a channelId is given, the list is scoped to that channel (editors only see the projects they are members of there). Set unlinked=1 to list only the caller's channel-less legacy projects.
      parameters:
        - name: channelId
          in: query
          required: false
          description: When set, only return projects inside this channel (caller must be a channel member)
          schema: { type: string }
        - name: unlinked
          in: query
          required: false
          description: When 1, return only the caller's projects that are not attached to any channel yet
          schema: { type: string }
      responses:
        "200":
          description: Projects the user owns or is a member of
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoProject" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of the requested channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createVideoProject
      tags: [content-creators]
      summary: Create a locked video project in a channel (Captain)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoProjectDetail" }
        "400":
          description: Invalid project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Caller does not own the channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List the channels on the caller's CMS grid
      description: Channels the caller owns (OWNER) or is an editor on (EDITOR), each with their role, YouTube link state, and project/editor counts. Used by the CMS landing page.
      responses:
        "200":
          description: The caller's channels (owned + editor mirror cards)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelSummary" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a new Creator Den channel (CREATED, unlinked)
      description: Creates the channel and its OWNER membership row. YouTube OAuth linking (Phase 2 connect flow) later upgrades it to CONNECTED with real branding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "400":
          description: Invalid channel name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Read a channel the caller is on (owner or editor)
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: Channel detail with the caller's role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Rename a channel (owner only)
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelUpdate" }
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "400":
          description: Invalid update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete an empty channel (owner only)
      description: Fails with 409 while the channel still has projects; the channel must be emptied first. Deleting also removes channel membership rows.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "204":
          description: Channel deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Channel still has projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/oauth/start:
    post:
      operationId: startChannelOauth
      tags: [channels]
      summary: Start linking a channel to its YouTube channel via Google OAuth (owner only)
      description: Validates the caller owns the channel, generates a PKCE consent URL with a signed state token, and returns the Google authorization URL to open in a new tab. Fails when YouTube OAuth credentials are not configured on the server.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: Google consent URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelOauthStartResponse" }
        "400":
          description: Not the owner, already connected, or OAuth not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/oauth/exchange:
    post:
      operationId: exchangeChannelOauth
      tags: [channels]
      summary: Exchange the Google consent code and bind the YouTube channel
      description: Verifies the signed state, swaps the code for tokens at Google, fetches the connected YouTube channel (mine=true), refuses a YouTube channel already bound elsewhere, stores the tokens encrypted, and upgrades the channel to CONNECTED with real branding.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelOauthExchangeInput" }
      responses:
        "200":
          description: The channel, now CONNECTED with YouTube branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "400":
          description: Expired/invalid state, Google rejection, or channel already bound elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/oauth/disconnect:
    post:
      operationId: disconnectChannelOauth
      tags: [channels]
      summary: Disconnect the YouTube link (owner only)
      description: Revokes the Google token (best-effort), clears the encrypted token vault, and returns the channel to CREATED. Projects, roster, and editors stay; the card shows the connect action again.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: The channel, back to CREATED without branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/people:
    get:
      operationId: listChannelPeople
      tags: [channels]
      summary: List the channel roster (owner + editors) with resolved identities
      description: "GitHub-contributors-style roster for the channel home: every user on the channel plus the project roles they hold across the channel's projects."
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: Channel roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelPerson" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/projects:
    get:
      operationId: listChannelProjects
      tags: [channels]
      summary: List the projects shown on a channel home
      description: The owner sees every project in the channel; an editor sees only the projects they are an ACTIVE member of. Same project-row shape as the global project list.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: Channel projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoProject" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/analytics/overview:
    get:
      operationId: getChannelAnalyticsOverview
      tags: [channel-analytics]
      summary: Channel analytics KPIs + daily series (DB-backed)
      description: Serves the channel's KPI cards and views / watch-time / subs / revenue day series from the snapshot tables, plus the latest sync state. Never calls YouTube on a page load; freshness is surfaced via lastSyncedAt and status.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
        - name: from
          in: query
          required: false
          description: Inclusive window start (YYYY-MM-DD). Defaults to the first stored day.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Inclusive window end (YYYY-MM-DD). Defaults to today.
          schema: { type: string }
      responses:
        "200":
          description: Overview KPIs, day series, and sync freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelAnalyticsOverview" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/analytics/videos:
    get:
      operationId: listChannelAnalyticsVideos
      tags: [channel-analytics]
      summary: Video table rows with filters, sort, and cursor pagination
      description: Merges the video catalog with metrics summed over the window (or the latest day). Supports title search, date range, sort chips (views / watchTime / likes / ctr / retention / revenue / publishedAt), direction, and a simple opaque cursor.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
        - name: q
          in: query
          required: false
          description: Title substring search
          schema: { type: string }
        - name: sort
          in: query
          required: false
          description: Sort key
          schema: { type: string, enum: [views, watchTime, likes, ctr, retention, revenue, publishedAt], default: publishedAt }
        - name: dir
          in: query
          required: false
          description: Sort direction
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: from
          in: query
          required: false
          description: Inclusive metric window start (YYYY-MM-DD)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Inclusive metric window end (YYYY-MM-DD)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size (default 25, max 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page
          schema: { type: string }
      responses:
        "200":
          description: Video rows for the table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelAnalyticsVideoList" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/analytics/videos/{videoRowId}:
    get:
      operationId: getChannelAnalyticsVideo
      tags: [channel-analytics]
      summary: Per-video analytics detail (KPIs, day series, channel-median context)
      description: Lifetime + window totals, the day series, and the channel's median CTR / average view duration for anomaly context. All DB-backed.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
        - { $ref: "#/components/parameters/VideoRowId" }
        - name: from
          in: query
          required: false
          description: Inclusive window start (YYYY-MM-DD)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Inclusive window end (YYYY-MM-DD)
          schema: { type: string }
      responses:
        "200":
          description: Video analytics detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelAnalyticsVideoDetail" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Video not found in this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/analytics/videos/{videoRowId}/report:
    get:
      operationId: getChannelAnalyticsVideoReport
      tags: [channel-analytics]
      summary: One report section (retention / traffic / demographics / devices / revenue)
      description: Serves the report from the cache for the requested period. When the cache is missing or older than YT_REPORT_TTL_MINUTES and a sync is allowed, kicks a background sync and returns stale=true so the UI can show refreshing and re-query.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
        - { $ref: "#/components/parameters/VideoRowId" }
        - name: kind
          in: query
          required: true
          description: The report section
          schema: { type: string, enum: [RETENTION, TRAFFIC, PLAYBACK_LOCATION, DEMOGRAPHICS, DEVICES, REVENUE, SUBS] }
        - name: period
          in: query
          required: false
          description: "Window length in days ending today (defaults per kind: 28 for RETENTION, 90 for the rest)"
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: Report rows (possibly stale with a sync kicked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelAnalyticsReport" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a member of this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Video not found in this channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /channels/{channelId}/analytics/sync:
    post:
      operationId: runChannelAnalyticsSync
      tags: [channel-analytics]
      summary: Manually run the analytics sync (owner, throttled ~1/min)
      description: Runs the full sync pipeline — catalog crawl, incremental daily metrics, stale report refresh, anomaly rules — and returns the new sync state. Non-owners get 403; repeated calls within a minute get 429.
      parameters:
        - { $ref: "#/components/parameters/ChannelId" }
      responses:
        "200":
          description: The new sync state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSyncState" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not the channel owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Manual sync throttled (once per minute)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/channel:
    patch:
      operationId: attachVideoProjectChannel
      tags: [content-creators]
      summary: Attach a legacy unlinked project to one of the Captain's channels
      description: Legacy projects created before the multi-channel restructure have no channel. The Captain attaches them to a channel they own so the project appears on that channel home (and the CMS grid) again.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectChannelInput" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoProject" }
        "400":
          description: Project already has a channel or target channel is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not the project Captain or not the channel owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Project or channel not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/projects:
    get:
      operationId: listPublicVideoProjects
      tags: [content-creators]
      summary: List a user's public content-creation projects
      description: Public profile track history — only projects the user owns or participates in that are marked PUBLIC. Private projects never appear.
      parameters:
        - { $ref: "#/components/parameters/VideoUserId" }
      responses:
        "200":
          description: Public projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoProject" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/explore/creators:
