            application/json:
              schema: { $ref: "#/components/schemas/VideoFollowState" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/follow:
