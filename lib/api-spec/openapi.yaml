      summary: Re-import an edited interchange document (EDL, FCPXML, or OTIO) from an external NLE as a new timeline version
      description: The push half of the round-trip — parse the CMX3600 EDL, FCPXML, or OpenTimelineIO document, relink its sources to vault assets, save a new Git-style version, and (by default) submit it for Captain review.
