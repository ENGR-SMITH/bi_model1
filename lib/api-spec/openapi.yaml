          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, most_applied] }
        - name: followed
          in: query
          required: false
          description: Order posts from Captains the caller follows first
          schema: { type: boolean }
        - name: mine
          in: query
          required: false
