                items: { $ref: "#/components/schemas/VideoCreatorSummary" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/explore/projects:
    get:
      operationId: listExploreProjects
      tags: [content-creators]
      summary: List public projects for discovery
      description: Every project marked PUBLIC, newest first, with the owner's display identity. Powers the explore browse page; name search is applied client-side.
      responses:
        "200":
          description: Public projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoPublicProject" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/social:
    get:
      operationId: getVideoUserSocial
