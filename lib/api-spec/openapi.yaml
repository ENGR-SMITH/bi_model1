      responses:
        "200":
          description: Updated shared document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDocument" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/projects/{projectId}/thread:
    post:
      operationId: getOrCreateProjectThread
