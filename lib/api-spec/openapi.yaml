      summary: Unfollow a user
      parameters:
        - { $ref: "#/components/parameters/VideoUserId" }
      responses:
        "200":
          description: Updated follow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoFollowState" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/followers:
    get:
