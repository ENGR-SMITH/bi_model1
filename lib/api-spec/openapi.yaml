            application/json:
              schema: { $ref: "#/components/schemas/CollaborationProject" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/projects/{projectId}/document:
    get:
      operationId: getCollaborationProjectDocument
      tags: [tandems]
      summary: Read the shared Author Den document both participants keep in sync
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Shared document
