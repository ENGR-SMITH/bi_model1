          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/projects/{projectId}/genealogy:
    get:
      operationId: listCollaborationGenealogy
      tags: [tandems]
      summary: List the immutable contribution genealogy for a shared project
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Contribution genealogy (attribution and parent chain)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GenealogyEntry" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/inbox:
    get:
      operationId: getCollaborationInbox
      tags: [collaborations]
      summary: Read privacy-safe collaboration notifications
      responses:
        "200":
          description: Notifications for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollaborationNotification" }
  /collaborations/threads:
    get:
      operationId: listCollaborationThreads
      tags: [collaborations]
      summary: List the viewer's collaboration threads with latest message preview
      responses:
        "200":
          description: Threads for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InboxThread" }
  /collaborations/activity:
    get:
      operationId: listAccountActivity
      tags: [collaborations]
      summary: List account-wide collaboration activity for the authenticated user
      responses:
        "200":
          description: Account activity events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
  /collaborations/notifications/{notificationId}/read:
    post:
      operationId: markCollaborationNotificationRead
      tags: [collaborations]
      summary: Mark a collaboration notification as read
      parameters:
        - { $ref: "#/components/parameters/NotificationId" }
      responses:
        "204": { description: Notification marked read }
  /users/{userId}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Read a user's public profile
      description: Returns the display name and authentication profile image of a user (e.g. the co-writer in a collaboration thread) so the client can render their real avatar.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found or profile unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/quota:
    get:
      operationId: getAccountQuota
      tags: [account]
      summary: Read the account's storage and project limits and usage
      description: Returns the workspace storage bar data (used/total/remaining bytes) and the project-count bar data (used/total/remaining), plus the buy-more plans the profile pages render. Defaults to 2 GB / 5 projects until a plan is purchased.
      responses:
        "200":
          description: Account quota and usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountQuota" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/quota/purchase:
    post:
      operationId: purchaseAccountQuota
      tags: [account]
      summary: Apply a buy-more plan to the account
      description: Extends the account's storage or project limit by the purchased plan. Payment is applied server-side here (the endpoint a Stripe Checkout confirmation will call once payments are wired); the profile bar reflects the new limit immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountQuotaPurchaseInput" }
      responses:
        "200":
          description: Updated quota with the applied plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountQuotaPurchaseResponse" }
        "400":
          description: Unknown plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{userId}/cv:
    get:
      operationId: getUserCv
      tags: [users]
      summary: Read a user's CV metadata
      description: Returns the CV metadata (file name, type, size, updated time) for a profile. Any signed-in user can see it so CVs are viewable on profiles.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: CV metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCv" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No CV uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: uploadUserCv
      tags: [users]
      summary: Upload or replace the user's CV
      description: Multipart upload of the CV file. Only the user themselves may upload; re-uploading replaces the previous file.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UserCvInput" }
      responses:
        "201":
          description: Uploaded CV metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCv" }
        "400":
          description: Invalid upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Only the user may manage their own CV
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteUserCv
      tags: [users]
      summary: Remove the user's CV
      description: Deletes the CV from the profile. Only the user themselves may delete it.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCvDeleteResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Only the user may manage their own CV
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{userId}/cv/file:
    get:
      operationId: getUserCvFile
      tags: [users]
      summary: Stream a user's CV file
      description: Returns the CV bytes so a profile visitor can view or download it.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: The CV bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No CV uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /tickets/status:
    get:
      operationId: getTicketStatus
      tags: [tandems]
      summary: Read the viewer's active category passes and the pass price
