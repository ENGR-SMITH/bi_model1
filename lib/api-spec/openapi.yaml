              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/audio:
    post:
      operationId: queueAudioPass
      tags: [content-creators]
      summary: Queue an audio pass (noise reduction, EQ, ducking) for the SOUND leg
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoAudioPassInput" }
      responses:
        "201":
          description: Queued audio job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }
        "400":
          description: Invalid audio request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the SOUND role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/exports:
    post:
      operationId: queueVideoExport
      tags: [content-creators]
      summary: Queue multi-format exports (16:9, 9:16, 1:1) of the FINISH master
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoExportInput" }
      responses:
        "201":
          description: Queued export job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }
        "400":
          description: Invalid export request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the FINISH role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/thumbnail:
    post:
      operationId: queueVideoThumbnail
      tags: [content-creators]
      summary: Queue thumbnail frame extraction from the FINISH master
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoThumbnailInput" }
      responses:
        "201":
          description: Queued thumbnail job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }
        "400":
          description: Invalid thumbnail request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the FINISH role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/files/{fileId}/download:
    get:
      operationId: downloadVideoFile
      tags: [content-creators]
      summary: Download a file once the Lock is released (audited)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoFileId" }
      responses:
        "200":
          description: File download stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Lock is still on, or not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: File not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/downloads:
    get:
      operationId: listVideoDownloads
      tags: [content-creators]
      summary: List the download audit trail (Captain)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Download audit trail
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoDownload" }
        "403":
          description: Captain only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/assets/{assetId}/reference-analyze:
    post:
      operationId: analyzeVideoReference
      tags: [content-creators]
      summary: Queue pacing analysis of a REFERENCE asset (viral reference import)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoAssetId" }
      responses:
        "201":
          description: Queued analysis job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }
        "403":
          description: Not allowed (not the SELECTS role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/assets/{assetId}/reference:
    get:
      operationId: getVideoReference
      tags: [content-creators]
      summary: Read the extracted pacing structure of a reference asset
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoAssetId" }
      responses:
        "200":
          description: Reference pacing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoReference" }
        "404":
          description: No analysis yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/grants:
    get:
      operationId: listVideoGrants
      tags: [content-creators]
      summary: List temporary download grants (Captain)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoGrant" }
        "403":
          description: Captain only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createVideoGrant
      tags: [content-creators]
      summary: Grant a member a temporary download (Captain)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoGrantInput" }
      responses:
        "201":
          description: Created grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoGrant" }
        "400":
          description: Invalid grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Captain only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/grants/{grantId}/revoke:
    post:
      operationId: revokeVideoGrant
      tags: [content-creators]
      summary: Revoke a temporary download grant instantly (Captain)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoGrantId" }
      responses:
        "200":
          description: Revoked grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoGrant" }
        "403":
          description: Captain only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Grant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/notifications:
    get:
      operationId: listVideoNotifications
      tags: [content-creators]
      summary: List the signed-in user's Tandem notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoNotification" }
  /video/notifications/{notificationId}/read:
    post:
      operationId: markVideoNotificationRead
      tags: [content-creators]
      summary: Mark a notification as read
      parameters:
        - { $ref: "#/components/parameters/VideoNotificationId" }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoNotification" }
        "404":
          description: Notification not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  parameters:
    SeedId:
      name: seedId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContinuationId:
      name: continuationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GenreQuery:
      name: genre
      in: query
      required: false
      schema: { type: string }
    UnitQuery:
      name: unit
      in: query
      required: false
      schema: { type: string }
    LanguageQuery:
      name: language
      in: query
      required: false
      schema: { type: string }
    ProtocolQuery:
      name: protocol
      in: query
      required: false
      schema: { type: string }
    AvailabilityQuery:
      name: availability
      in: query
      required: false
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        enum: [groq, openrouter, ollama, lmstudio, freebuff]
    VideoProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoUserId:
      name: userId
      in: path
      required: true
      description: Clerk user id whose public track history to read
      schema: { type: string, minLength: 1 }
    VideoActivityLegQuery:
      name: leg
      in: query
      required: false
      description: Optional leg (stage) filter — returns only that leg's events
      schema:
        type: string
        enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL]
    VideoAssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoFileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoGrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoNotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoLeg:
      name: leg
      in: path
      required: true
      schema: { type: string, enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL] }
    VideoSubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoCommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    CollaborationSeed:
      type: object
      properties:
        id: { type: string }
        creatorId: { type: string }
        creatorName: { type: string }
        sourceProjectId: { type: string }
        sourceProjectTitle: { type: string }
        sourceSceneId: { type: ["string", "null"] }
        sourceVersion: { type: integer }
        seedText: { type: string }
        unitType: { type: string }
        protocol: { type: string }
        genre: { type: string }
        tone: { type: string }
        language: { type: string }
        plotConstraints: { type: string }
        desiredRole: { type: string }
        visibility: { type: string }
        respondentLimit: { type: integer }
        respondentCount: { type: integer }
        myApplicationId: { type: ["string", "null"] }
        myApplicationStatus: { type: ["string", "null"] }
        availability: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, creatorId, creatorName, sourceProjectId, sourceProjectTitle, sourceSceneId, sourceVersion, seedText, unitType, protocol, genre, tone, language, plotConstraints, desiredRole, visibility, respondentLimit, respondentCount, myApplicationId, myApplicationStatus, availability, publishedAt, createdAt]
    CollaborationSeedInput:
      type: object
      properties:
        sourceProjectId: { type: string, minLength: 1 }
        sourceProjectTitle: { type: string, minLength: 1 }
        # Display name of the creator at publish time (optional; falls back to “Author”).
        creatorName: { type: string }
        sourceSceneId: { type: ["string", "null"] }
        sourceVersion: { type: integer, minimum: 1 }
        seedText: { type: string, minLength: 1, maxLength: 12000 }
        unitType: { type: string, minLength: 1 }
        protocol: { type: string, minLength: 1 }
        genre: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        plotConstraints: { type: string }
        desiredRole: { type: string, minLength: 1 }
        visibility: { type: string, enum: [SEED_AND_BRIEF, SEED_ONLY] }
        respondentLimit: { type: integer, enum: [3, 5, 10, 0] }
        # The full Author Den project snapshot this seed was frozen from.
        # Respondents fork this document when they answer; the creator merges
        # against it when accepting a fork.
        projectDocument: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [sourceProjectId, sourceProjectTitle, seedText, unitType, protocol, genre, tone, language, plotConstraints, desiredRole, visibility, respondentLimit]
    CollaborationSeedUpdate:
      type: object
      properties:
        unitType: { type: string, minLength: 1 }
        protocol: { type: string, minLength: 1 }
        genre: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        plotConstraints: { type: string }
        desiredRole: { type: string, minLength: 1 }
        visibility: { type: string, enum: [SEED_AND_BRIEF, SEED_ONLY] }
        respondentLimit: { type: integer, enum: [3, 5, 10, 0] }
    SeedApplicationInput:
      type: object
      properties:
        respondentName: { type: string, minLength: 1 }
      required: [respondentName]
    SeedApplication:
      type: object
      properties:
        id: { type: string }
        seedId: { type: string }
        respondentId: { type: string }
        respondentName: { type: string }
        sourceProjectTitle: { type: string }
        sourceSeedText: { type: string }
        draftText: { type: string }
        draftComments: { type: string }
        status: { type: string }
        submittedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, seedId, respondentId, respondentName, sourceProjectTitle, sourceSeedText, draftText, draftComments, status, submittedAt, createdAt, updatedAt]
    ContinuationDraftInput:
      type: object
      properties:
        draftText: { type: string, maxLength: 20000 }
        draftComments: { type: string, maxLength: 6000 }
        # The respondent's working fork of the seed project, saved as they
        # edit and carried into the submission for the creator's preview.
        projectDocument: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [draftText, draftComments]
    AuthorProjectDocument:
      type: object
      additionalProperties: true
      description: A serialized Author Den project (title, scenes, characters, plots, world).
    ProjectDocument:
      type: object
      properties:
        document: { $ref: "#/components/schemas/AuthorProjectDocument" }
        updatedAt: { type: ["string", "null"], format: date-time }
      required: [document, updatedAt]
    SaveCollaborationProjectDocumentInput:
      type: object
      properties:
        document: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [document]
    ContinuationSubmission:
      type: object
      properties:
        id: { type: string }
        applicationId: { type: string }
        seedId: { type: string }
        creatorId: { type: string }
        respondentId: { type: string }
        respondentName: { type: string }
        sourceProjectTitle: { type: string }
        seedText: { type: string }
        continuationText: { type: string }
        comments: { type: string }
        notificationId: { type: ["string", "null"] }
        read: { type: boolean }
        status: { type: string }
        submittedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, applicationId, seedId, creatorId, respondentId, respondentName, sourceProjectTitle, seedText, continuationText, comments, notificationId, read, status, submittedAt, createdAt]
    WriterProfile:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        bio: { type: string }
        genres:
          type: array
          items: { type: string }
        tones:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        submittedCount: { type: integer }
        acceptedCount: { type: integer }
        completedCount: { type: integer }
      required: [userId, displayName, bio, genres, tones, languages, submittedCount, acceptedCount, completedCount]
    AdvisorySignal:
      type: object
      properties:
        category: { type: string }
        level: { type: string, enum: [positive, neutral, attention] }
        title: { type: string }
        detail: { type: string }
      required: [category, level, title, detail]
    ContinuationAdvisory:
      type: object
      properties:
        disclaimer: { type: string }
        signals:
          type: array
          items: { $ref: "#/components/schemas/AdvisorySignal" }
        source: { type: string, enum: [oracle, local] }
        available: { type: boolean }
        providerId: { type: ["string", "null"] }
        modelId: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        generatedAt: { type: string, format: date-time }
      required: [disclaimer, signals, source, available, providerId, modelId, note, generatedAt]
    CollaborationMessage:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, threadId, senderId, body, createdAt]
    CollaborationThread:
      type: object
      properties:
        id: { type: string }
        continuationId: { type: string }
        creatorId: { type: string }
        respondentId: { type: string }
        projectId: { type: ["string", "null"] }
        creatorName: { type: string }
        respondentName: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/CollaborationMessage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, continuationId, creatorId, respondentId, projectId, creatorName, respondentName, messages, createdAt, updatedAt]
    ThreadUnread:
      type: object
      properties:
        unread: { type: boolean }
        count: { type: integer }
      required: [unread, count]
    InboxThread:
      type: object
      properties:
        id: { type: string }
        continuationId: { type: string }
        projectId: { type: ["string", "null"] }
        seedId: { type: ["string", "null"] }
        sourceProjectTitle: { type: string }
        partnerId: { type: string }
        partnerName: { type: string }
        lastMessage: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"] }
        messageCount: { type: integer }
        unread: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, continuationId, projectId, seedId, sourceProjectTitle, partnerId, partnerName, lastMessage, lastMessageAt, messageCount, unread, createdAt, updatedAt]
    CollaborationMessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
      required: [body]
    CollaborationProject:
      type: object
      properties:
        id: { type: string }
        seedId: { type: string }
        title: { type: string }
        creatorId: { type: string }
        creatorName: { type: string }
        respondentId: { type: string }
        respondentName: { type: string }
        seedText: { type: string }
        continuationText: { type: string }
        status: { type: string }
        contractVersion: { type: integer }
        creatorApproved: { type: boolean }
        respondentApproved: { type: boolean }
        currentTurn: { type: string }
        threadId: { type: ["string", "null"] }
        documentAvailable: { type: boolean }
        createdAt: { type: string, format: date-time }
        lockedAt: { type: ["string", "null"], format: date-time }
      required: [id, seedId, title, creatorId, creatorName, respondentId, respondentName, seedText, continuationText, status, contractVersion, creatorApproved, respondentApproved, currentTurn, threadId, documentAvailable, createdAt, lockedAt]
    CollaborationNotification:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        resourceId: { type: ["string", "null"] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, category, title, body, deepLink, resourceId, read, createdAt]
    WorkBlock:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        ownerId: { type: string }
        kind: { type: string }
        content: { type: string }
        status: { type: string }
        parentBlockId: { type: ["string", "null"] }
        turnOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, ownerId, kind, content, status, parentBlockId, turnOrder, createdAt, updatedAt]
    WorkBlockInput:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 20000 }
        kind: { type: string, enum: [FOLLOWUP], default: FOLLOWUP }
      required: [content]
    StoryBibleEntry:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string }
        name: { type: string }
        content: { type: string }
        ownerId: { type: string }
        shared: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, kind, name, content, ownerId, shared, createdAt, updatedAt]
    StoryBibleEntryInput:
      type: object
      properties:
        kind: { type: string, enum: [character, location, item, rule, note] }
        name: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 12000 }
        shared: { type: boolean, default: false }
      required: [kind, name, content]
    ActivityEvent:
      type: object
      properties:
        id: { type: string }
        projectId: { type: ["string", "null"] }
        seedId: { type: ["string", "null"] }
        actorId: { type: string }
        eventType: { type: string }
        summary: { type: string }
        resourceId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, seedId, actorId, eventType, summary, resourceId, createdAt]
    CollaborationAnnotation:
      type: object
      properties:
        id: { type: string }
        continuationId: { type: string }
        authorId: { type: string }
        rangeStart: { type: integer }
        rangeEnd: { type: integer }
        body: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, continuationId, authorId, rangeStart, rangeEnd, body, createdAt]
    CollaborationAnnotationInput:
      type: object
      properties:
        rangeStart: { type: integer, minimum: 0 }
        rangeEnd: { type: integer, minimum: 1 }
        body: { type: string, minLength: 1, maxLength: 2000 }
      required: [rangeStart, rangeEnd, body]
    GenealogyEntry:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        blockId: { type: ["string", "null"] }
        parentBlockId: { type: ["string", "null"] }
        contributorId: { type: string }
        contributorName: { type: string }
        role: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, blockId, parentBlockId, contributorId, contributorName, role, kind, createdAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserProfile:
      type: object
      properties:
