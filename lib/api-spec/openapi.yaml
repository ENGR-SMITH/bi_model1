        "200":
          description: Follower list with the viewer's follow state per entry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoFollowListEntry" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/following:
    get:
      operationId: listVideoUserFollowing
      tags: [content-creators]
      summary: List the users a user follows
      parameters:
        - { $ref: "#/components/parameters/VideoUserId" }
      responses:
        "200":
          description: Following list with the viewer's follow state per entry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoFollowListEntry" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/users/{userId}/contributions:
    get:
      operationId: getVideoUserContributions
      tags: [content-creators]
      summary: Read a user's public-project contribution graph
      description: Daily activity counts across PUBLIC projects the user acted in, zero-filled over the trailing ~26 weeks for the GitHub-style contribution grid.
      parameters:
        - { $ref: "#/components/parameters/VideoUserId" }
      responses:
        "200":
          description: Contribution days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoContributions" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}:
    get:
      operationId: getVideoProject
      tags: [content-creators]
      summary: Read a permitted video project with members and assets
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoProjectDetail" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteVideoProject
      tags: [content-creators]
      summary: Delete a project and everything inside it (Captain only)
      description: Removes the project, its members, vault assets, timelines, versions, submissions, comments, and activity. The Captain (owner) only. Files already written to disk are left in place so content-addressed blobs shared with other projects stay intact.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "204":
          description: Project deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/visibility:
    patch:
      operationId: updateVideoProjectVisibility
      tags: [content-creators]
      summary: Set a project's profile visibility (Captain only)
      description: PUBLIC projects appear on the Captain's public profile track history; PRIVATE projects stay visible to members only. Only the project Captain (its creator) can change this.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoProjectVisibilityInput" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoProject" }
        "400":
          description: Invalid visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Project not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/members:
    post:
      operationId: addVideoProjectMember
      tags: [content-creators]
      summary: Invite a member by email with a leg role (Captain only)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoMemberInput" }
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoMember" }
        "400":
          description: Invalid member or user not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/members/{memberId}:
    patch:
      operationId: updateVideoProjectMemberRoles
      tags: [content-creators]
      summary: Update a member's roles (Captain only)
      description: Replaces the roles a member holds — grant more roles, or take them away. The Captain's own roles cannot be changed.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoMemberId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoMemberRolesInput" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoMember" }
        "400":
          description: Invalid roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the Captain, or the member is the Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: removeVideoProjectMember
      tags: [content-creators]
      summary: Remove a member from the project (Captain only)
      description: Removes the member's access, active download grants, and submissions. The Captain cannot be removed.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoMemberId" }
      responses:
        "204":
          description: Member removed
        "403":
          description: Not allowed (not the Captain, or the member is the Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/assets:
    get:
      operationId: listVideoAssets
      tags: [content-creators]
      summary: List the locked assets in a project vault
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Vault assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoAsset" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: uploadVideoAsset
      tags: [content-creators]
      summary: Upload raw footage into the locked vault
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/VideoAssetUploadInput" }
      responses:
        "201":
          description: Uploaded asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAsset" }
        "400":
          description: Invalid upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/assets/{assetId}:
    get:
      operationId: getVideoAsset
      tags: [content-creators]
      summary: Read an asset with its processed files and transcript
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoAssetId" }
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAssetDetail" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/assets/{assetId}/proxy:
    get:
      operationId: getVideoAssetProxy
      tags: [content-creators]
      summary: Stream the low-res proxy for a locked asset
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoAssetId" }
      responses:
        "200":
          description: Proxy media stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No proxy available for this asset yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}:
    get:
      operationId: getVideoTimeline
      tags: [content-creators]
      summary: Read the current working timeline for a leg
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: Timeline state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoTimelineState" }
        "400":
          description: Unknown leg
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: saveVideoTimeline
      tags: [content-creators]
      summary: Save a snapshot of the leg timeline (creates a version)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoTimelineSaveInput" }
      responses:
        "200":
          description: Saved timeline state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoTimelineState" }
        "400":
          description: Invalid snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the leg role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/versions:
    get:
      operationId: listVideoTimelineVersions
      tags: [content-creators]
      summary: List the Git-style snapshot history of a leg timeline
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoTimelineVersionSummary" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/versions/{versionId}:
    get:
      operationId: getVideoTimelineVersion
      tags: [content-creators]
      summary: Read the full snapshot of one timeline version (for diffing / review)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
        - { $ref: "#/components/parameters/VideoVersionId" }
      responses:
        "200":
          description: Full version with snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoTimelineVersionDetail" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Timeline or version not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/rollback:
    post:
      operationId: rollbackVideoTimeline
      tags: [content-creators]
      summary: Restore a previous snapshot as the new working head
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoTimelineRollbackInput" }
      responses:
        "200":
          description: Timeline state after rollback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoTimelineState" }
        "400":
          description: Unknown version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout:
    get:
      operationId: checkoutVideoTimeline
      tags: [content-creators]
      summary: Download the leg's current snapshot as a CMX3600 EDL for an external NLE
      description: The checkout half of the external-first round-trip — the editor opens the cut in Premiere/Resolve/Avid, finishes it there, and re-imports the result. FCPXML export lives at /checkout/fcpxml.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: CMX3600 EDL file (with a `* MEDIA MANIFEST` trailer)
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/fcpxml:
    get:
      operationId: checkoutVideoTimelineFcpxml
      tags: [content-creators]
      summary: Download the leg's current snapshot as an FCPXML 1.9 project for Final Cut or Premiere
      description: The FCPXML variant of the checkout — source media round-trips through the clip `uid`/`ref` attributes, so a re-import relinks exactly.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: FCPXML 1.9 document
          content:
            application/xml:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/otio:
    get:
      operationId: checkoutVideoTimelineOtio
      tags: [content-creators]
      summary: Download the leg's current snapshot as an OpenTimelineIO (OTIO) Timeline.1 document
      description: The OTIO variant of the checkout — the canonical interchange. Source media round-trips through `metadata.assetId`, so a re-import relinks exactly.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: OTIO Timeline.1 JSON document
          content:
            application/json:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/aaf:
    get:
      operationId: checkoutVideoTimelineAaf
      tags: [content-creators]
      summary: Download the leg's current snapshot as an AAF file (export-only)
      description: The AAF variant of the checkout — export-only per the design (AAF is a binary Microsoft format intended for one-directional handoff to Avid/Premiere via AMA, not a round-trip interchange). Source media round-trips through the SourceMob UMIDs, matching the other formats' relink keys.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: AAF binary (OLE2/CFB container with a self-contained MetaDictionary)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/manifest:
    get:
      operationId: getVideoTimelineCheckoutManifest
      tags: [content-creators]
      summary: List the source media referenced by a leg's checkout EDL
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: Referenced media (deduped, in first-use order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCheckoutManifest" }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/export:
    post:
      operationId: exportVideoTimelineCheckout
      tags: [content-creators]
      summary: Enqueue a background checkout bundle build (EXPORT_BUNDLE job) for a leg
      description: The background half of the checkout — materializes the leg's saved snapshot as a single downloadable zip (EDL + FCPXML + OTIO + AAF + media manifest, plus the referenced originals when includeMedia is set) and streams `job.progress` to the project room while it runs. Returns 409 if a bundle is already building for this leg.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoCheckoutExportInput" }
      responses:
        "201":
          description: The enqueued EXPORT_BUNDLE job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCheckoutExportResponse" }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A bundle is already building for this leg
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/bundle:
    get:
      operationId: getVideoTimelineCheckoutBundle
      tags: [content-creators]
      summary: Get the latest EXPORT_BUNDLE job for a leg (queue state + artifact)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: The latest bundle job for this leg
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCheckoutBundleStatus" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No bundle has been built for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/bundle/download:
    get:
      operationId: getVideoTimelineCheckoutBundleDownload
      tags: [content-creators]
      summary: Download the built checkout bundle zip for a leg
      description: Streams the zip produced by the latest SUCCEEDED EXPORT_BUNDLE job for this leg.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: The bundle zip
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The bundle is not ready yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/import:
    post:
      operationId: importVideoTimeline
      tags: [content-creators]
      summary: Re-import an edited interchange document (EDL, FCPXML, or OTIO) from an external NLE as a new timeline version
      description: The push half of the round-trip — parse the CMX3600 EDL, FCPXML, or OpenTimelineIO document, relink its sources to vault assets, save a new Git-style version, and (by default) submit it for Captain review.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/VideoTimelineImportInput" }
      responses:
        "201":
          description: Imported timeline version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoTimelineImportResponse" }
        "400":
          description: Missing/empty document, unparseable events, or sources not in the vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed (not the leg role / Captain)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/activity:
    get:
      operationId: listVideoActivity
      tags: [content-creators]
      summary: Project activity feed (saves, imports, rollbacks, submissions, decisions, uploads)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoActivityLegQuery" }
      responses:
        "200":
          description: Activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoActivityEvent" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/genealogy:
    get:
      operationId: listVideoGenealogy
      tags: [content-creators]
      summary: Version provenance (every version chained to its parent, with review decisions)
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Version genealogy, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoGenealogyEntry" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/submissions:
    get:
      operationId: listVideoSubmissions
      tags: [content-creators]
      summary: List leg submissions for a project
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoSubmission" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createVideoSubmission
      tags: [content-creators]
      summary: Submit the current snapshot of a leg for Captain review
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoSubmissionInput" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoSubmission" }
        "400":
          description: Invalid submission
