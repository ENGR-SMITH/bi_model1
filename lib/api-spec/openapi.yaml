      responses:
        "200":
          description: Unread message state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadUnread" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/projects/{projectId}/thread/read:
    post:
      operationId: markCollaborationProjectThreadRead
