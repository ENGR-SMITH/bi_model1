        "201":
          description: Sent voice message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationMessage" }
        "400":
          description: Invalid voice note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/threads/{threadId}/audio/{fileId}:
    get:
      operationId: getCollaborationThreadAudio
      tags: [collaborations]
      summary: Stream a collaboration thread voice note
      description: Returns the audio bytes of a voice note. Participants only; the file lives in the shared upload dir under its uuid filename.
      parameters:
        - { $ref: "#/components/parameters/ThreadId" }
