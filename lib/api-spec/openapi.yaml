      responses:
        "200":
          description: Discoverable authors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExploreAuthor" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/projects:
