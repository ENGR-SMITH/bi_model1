  /video/projects/{projectId}/timelines/{leg}/checkout:
    get:
      operationId: checkoutVideoTimeline
      tags: [content-creators]
      summary: Download the leg's current snapshot as a CMX3600 EDL for an external NLE
      description: The checkout half of the external-first round-trip — the editor opens the cut in Premiere/Resolve/Avid, finishes it there, and re-imports the result. FCPXML export lives at /checkout/fcpxml.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: CMX3600 EDL file (with a `* MEDIA MANIFEST` trailer)
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/fcpxml:
    get:
      operationId: checkoutVideoTimelineFcpxml
      tags: [content-creators]
      summary: Download the leg's current snapshot as an FCPXML 1.9 project for Final Cut or Premiere
      description: The FCPXML variant of the checkout — source media round-trips through the clip `uid`/`ref` attributes, so a re-import relinks exactly.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: FCPXML 1.9 document
          content:
            application/xml:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/otio:
    get:
      operationId: checkoutVideoTimelineOtio
      tags: [content-creators]
      summary: Download the leg's current snapshot as an OpenTimelineIO (OTIO) Timeline.1 document
      description: The OTIO variant of the checkout — the canonical interchange. Source media round-trips through `metadata.assetId`, so a re-import relinks exactly.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: OTIO Timeline.1 JSON document
          content:
            application/json:
              schema: { type: string }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/aaf:
    get:
      operationId: checkoutVideoTimelineAaf
      tags: [content-creators]
      summary: Download the leg's current snapshot as an AAF file (export-only)
      description: The AAF variant of the checkout — export-only per the design (AAF is a binary Microsoft format intended for one-directional handoff to Avid/Premiere via AMA, not a round-trip interchange). Source media round-trips through the SourceMob UMIDs, matching the other formats' relink keys.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: AAF binary (OLE2/CFB container with a self-contained MetaDictionary)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/manifest:
    get:
      operationId: getVideoTimelineCheckoutManifest
      tags: [content-creators]
      summary: List the source media referenced by a leg's checkout EDL
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      responses:
        "200":
          description: Referenced media (deduped, in first-use order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCheckoutManifest" }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/projects/{projectId}/timelines/{leg}/checkout/export:
    post:
      operationId: exportVideoTimelineCheckout
      tags: [content-creators]
      summary: Enqueue a background checkout bundle build (EXPORT_BUNDLE job) for a leg
      description: The background half of the checkout — materializes the leg's saved snapshot as a single downloadable zip (EDL + FCPXML + OTIO + AAF + media manifest, plus the referenced originals when includeMedia is set) and streams `job.progress` to the project room while it runs. Returns 409 if a bundle is already building for this leg.
      parameters:
        - { $ref: "#/components/parameters/VideoProjectId" }
        - { $ref: "#/components/parameters/VideoLeg" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoCheckoutExportInput" }
      responses:
        "201":
          description: The enqueued EXPORT_BUNDLE job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCheckoutExportResponse" }
        "400":
          description: No snapshot saved for this leg yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A bundle is already building for this leg
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
