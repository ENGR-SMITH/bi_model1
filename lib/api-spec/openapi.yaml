      description: OPEN posts across the platform with the poster/channel/project summaries, the live applicant count, and the caller's own application state. ?mine=1 returns the caller's own posts (Captain) with application counts for the management view.
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArenaRole" }
        - name: channelId
          in: query
          required: false
          schema: { type: string }
