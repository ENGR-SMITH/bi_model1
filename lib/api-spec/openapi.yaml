      type: object
      description: Daily metric values; keys are absent where YouTube reports null (e.g. non-monetized rows)
      properties:
        views: { type: number }
        watchTimeMinutes: { type: number }
        averageViewDurationSeconds: { type: number }
        subscribersGained: { type: number }
        subscribersLost: { type: number }
        estimatedRevenueUsd: { type: number }
        estimatedAdRevenueUsd: { type: number }
        likes: { type: number }
        comments: { type: number }
        shares: { type: number }
        impressions: { type: number }
        impressionsClickThroughRate: { type: number }
        averageViewPercentage: { type: number }
    ChannelAnalyticsOverview:
      type: object
      description: Channel overview — summed KPIs, day series, and sync freshness
      properties:
        channelId: { type: string }
        from: { type: string }
        to: { type: string }
        kpis: { $ref: "#/components/schemas/ChannelAnalyticsMetrics" }
        series:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              views: { type: ["number", "null"] }
              watchTimeMinutes: { type: ["number", "null"] }
              subscribersGained: { type: ["number", "null"] }
              subscribersLost: { type: ["number", "null"] }
              estimatedRevenueUsd: { type: ["number", "null"] }
            required: [day]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        status: { type: ["string", "null"], enum: [IDLE, SYNCING, ERROR] }
        error: { type: ["string", "null"] }
        newVideosSeen: { type: integer }
      required: [channelId, from, to, kpis, series, lastSyncedAt, status, error, newVideosSeen]
    ChannelAnalyticsVideoRow:
      type: object
      description: One video-table row — catalog fields plus metrics summed over the window (or the latest day when no window is given)
      properties:
        videoRowId: { type: string }
        youtubeVideoId: { type: string }
        title: { type: string }
        publishedAt: { type: ["string", "null"] }
        contentKind: { type: string, enum: [LONG_FORM, SHORT, LIVE] }
        durationSeconds: { type: ["integer", "null"] }
        thumbnails: { type: ["object", "null"] }
        views: { type: ["number", "null"] }
        watchTimeMinutes: { type: ["number", "null"] }
        averageViewDurationSeconds: { type: ["number", "null"] }
        likes: { type: ["number", "null"] }
        comments: { type: ["number", "null"] }
        shares: { type: ["number", "null"] }
        impressions: { type: ["number", "null"] }
        impressionsClickThroughRate: { type: ["number", "null"] }
        averageViewPercentage: { type: ["number", "null"] }
        estimatedRevenueUsd: { type: ["number", "null"] }
      required: [videoRowId, youtubeVideoId, title, publishedAt, contentKind, durationSeconds, thumbnails, views, watchTimeMinutes, averageViewDurationSeconds, likes, comments, shares, impressions, impressionsClickThroughRate, averageViewPercentage, estimatedRevenueUsd]
    ChannelAnalyticsVideoList:
      type: object
      description: A page of video-table rows
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChannelAnalyticsVideoRow" } }
        nextCursor: { type: ["string", "null"] }
      required: [items, nextCursor]
    ChannelAnalyticsVideoDetail:
      type: object
      description: Per-video analytics — window/lifetime totals, day series, and channel-median context for anomaly banners
      properties:
        videoRowId: { type: string }
        youtubeVideoId: { type: string }
        title: { type: string }
        description: { type: string }
        thumbnails: { type: ["object", "null"] }
        publishedAt: { type: ["string", "null"] }
        contentKind: { type: string, enum: [LONG_FORM, SHORT, LIVE] }
        durationSeconds: { type: ["integer", "null"] }
        privacyStatus: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        defaultLanguage: { type: ["string", "null"] }
        totals: { $ref: "#/components/schemas/ChannelAnalyticsMetrics" }
        series:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              metrics: { $ref: "#/components/schemas/ChannelAnalyticsMetrics" }
            required: [day, metrics]
        channelMedians:
          type: object
          properties:
            impressionsClickThroughRate: { type: ["number", "null"] }
            averageViewDurationSeconds: { type: ["number", "null"] }
          required: [impressionsClickThroughRate, averageViewDurationSeconds]
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        status: { type: ["string", "null"], enum: [IDLE, SYNCING, ERROR] }
        error: { type: ["string", "null"] }
      required: [videoRowId, youtubeVideoId, title, description, thumbnails, publishedAt, contentKind, durationSeconds, privacyStatus, categoryId, defaultLanguage, totals, series, channelMedians, lastSyncedAt, status, error]
    ChannelAnalyticsReport:
      type: object
      description: One report section from the cache; stale=true means a refresh sync was kicked and the client should re-query shortly
      properties:
        kind: { type: string, enum: [RETENTION, TRAFFIC, PLAYBACK_LOCATION, DEMOGRAPHICS, DEVICES, REVENUE, SUBS] }
        periodStart: { type: string }
        periodEnd: { type: string }
        fetchedAt: { type: ["string", "null"] }
        rows:
          type: array
          description: Row objects keyed by column name
          items: { type: object, additionalProperties: { type: ["string", "number", "null"] } }
        stale: { type: boolean }
      required: [kind, periodStart, periodEnd, fetchedAt, rows, stale]
    ChannelSyncState:
      type: object
      description: The per-channel analytics sync state + the latest run outcome
      properties:
        status: { type: string, enum: [IDLE, SYNCING, ERROR] }
        error: { type: ["string", "null"] }
        newVideosSeen: { type: integer }
        lastVideoSyncAt: { type: ["string", "null"], format: date-time }
        lastMetricsSyncAt: { type: ["string", "null"], format: date-time }
      required: [status, error, newVideosSeen, lastVideoSyncAt, lastMetricsSyncAt]
    VideoCreatorSummary:
      type: object
      description: A discoverable Creator Den user (has public track history), with social counts for the viewer
      properties:
        userId: { type: string }
        displayName: { type: string }
        imageUrl: { type: ["string", "null"] }
        publicProjectCount: { type: integer }
        followerCount: { type: integer }
        isFollowing: { type: ["boolean", "null"], description: Whether the viewer follows this creator (null when viewing yourself) }
      required: [userId, displayName, imageUrl, publicProjectCount, followerCount, isFollowing]
    VideoPublicProject:
      type: object
      description: A public project as shown on explore — the owner's display identity rides along for attribution
      properties:
        id: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        ownerImageUrl: { type: ["string", "null"] }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ownerId, ownerName, ownerImageUrl, name, description, status, visibility, createdAt, updatedAt]
    VideoFollowState:
      type: object
      description: Follow counts for a user plus whether the viewer follows them
      properties:
        userId: { type: string }
        followerCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: ["boolean", "null"], description: Whether the viewer follows this user (null when viewing yourself) }
      required: [userId, followerCount, followingCount, isFollowing]
    VideoFollowListEntry:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        imageUrl: { type: ["string", "null"] }
        isFollowing: { type: ["boolean", "null"] }
      required: [userId, displayName, imageUrl, isFollowing]
    VideoContributionDay:
      type: object
      description: One day cell in the contribution graph. Date is a plain "YYYY-MM-DD" key, not a timestamp — it must not be coerced to a Date.
      properties:
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        count: { type: integer }
      required: [date, count]
    VideoContributions:
      type: object
      description: Public-project activity aggregated into the GitHub-style contribution graph (contiguous recent days, zero-filled)
      properties:
        total: { type: integer }
        days:
          type: array
          items: { $ref: "#/components/schemas/VideoContributionDay" }
      required: [total, days]
    VideoProjectDetail:
      type: object
      properties:
        id: { type: string }
        channelId: { type: ["string", "null"], description: The workspace channel this project lives in (null for legacy unlinked projects) }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        visibility:
          type: string
          enum: [PUBLIC, PRIVATE]
          description: Whether the project appears on the owner's public profile
        viewerAccess:
          type: string
          enum: [member, public, applicant, none]
          description: >-
            How the signed-in caller may view this project. member = full member access;
            public = non-member read-only preview of a PUBLIC project; applicant = non-member
            read-only Arena preview while an open role post exists on this project; none = no
            access. Optional (not in required) so create/list payloads that reuse this schema
            and predate the field stay valid — when absent, fall back to the caller's role state.
        myRoles:
          type: array
          items: { type: string }
          description: The viewer's roles in this project (e.g. ["VIDEO", "THUMBNAIL"]; always includes CAPTAIN for the owner)
        members:
          type: array
          items: { $ref: "#/components/schemas/VideoMember" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/VideoAsset" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, channelId, ownerId, name, description, status, visibility, myRoles, members, assets, createdAt, updatedAt]
    VideoMember:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        name: { type: ["string", "null"], description: Resolved Clerk display name, when available (falls back to the raw id client-side) }
        imageUrl: { type: ["string", "null"], description: Resolved Clerk avatar url, when available (drives avatars on timeline cards and rosters) }
        roles:
          type: array
          items: { type: string }
          description: Every role this member holds in the project, e.g. ["VIDEO", "THUMBNAIL"]
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, userId, name, imageUrl, roles, status, createdAt]
    VideoMemberInput:
      type: object
      description: Invite a teammate by their unique Tandem ID (e.g. TANDEM6EUHY) — the handle shown on every user's profile.
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 20
          description: The invitee's unique Tandem ID, e.g. TANDEM6EUHY.
        role:
          type: string
          enum: [VIDEO, AUDIO, SCRIPT, THUMBNAIL, UPLOADER, VIEWER]
          description: The role to assign. Inviting a user who is already a member adds the role to their existing set.
      required: [uid, role]
    VideoMemberRolesInput:
      type: object
      description: The full set of roles a member should hold after the update.
      properties:
        roles:
          type: array
          minItems: 1
          items: { type: string }
      required: [roles]
    VideoAsset:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        uploaderId: { type: string }
        kind: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: ["integer", "null"] }
        contentHash: { type: ["string", "null"] }
        status: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, uploaderId, kind, fileName, mimeType, sizeBytes, durationMs, contentHash, status, version, createdAt]
    VideoAssetUploadInput:
      type: object
      description: Multipart upload of a raw asset into the project vault
      properties:
        file:
          type: string
          format: binary
        kind:
          type: string
          enum: [RAW_VIDEO, RAW_AUDIO, SCREEN_REC, B_ROLL, REFERENCE, VO_PICKUP, GRAPHIC, THUMBNAIL_DESIGN]
      required: [file, kind]
    VideoAssetFile:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        metadata: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, kind, mimeType, sizeBytes, metadata, createdAt]
    VideoTranscriptSegment:
      type: object
      properties:
        id: { type: string }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string }
        speaker: { type: ["string", "null"] }
      required: [id, startMs, endMs, text, speaker]
    VideoTranscript:
      type: object
      properties:
        id: { type: string }
        assetId: { type: string }
        language: { type: string }
        model: { type: string }
        status: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/VideoTranscriptSegment" }
      required: [id, assetId, language, model, status, segments]
    VideoAssetDetail:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        uploaderId: { type: string }
        kind: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        durationMs: { type: ["integer", "null"] }
        contentHash: { type: ["string", "null"] }
        status: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: "#/components/schemas/VideoAssetFile" }
        transcript: { type: ["object", "null"], allOf: [{ $ref: "#/components/schemas/VideoTranscript" }] }
      required: [id, projectId, uploaderId, kind, fileName, mimeType, sizeBytes, durationMs, contentHash, status, version, createdAt, files, transcript]
    VideoTimelineState:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        leg: { type: string }
        status: { type: string }
        version: { type: ["integer", "null"] }
        snapshot: { type: ["object", "null"], additionalProperties: true }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VideoTimelineVersionSummary" }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, leg, status, version, snapshot, versions, updatedAt]
    VideoTimelineVersionSummary:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        message: { type: string }
        createdById: { type: string }
        parentVersionId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, version, message, createdById, parentVersionId, createdAt]
    VideoActivityEvent:
      type: object
      description: One immutable line on the project activity feed
      properties:
        id: { type: string }
        actorId: { type: string }
        actorName: { type: ["string", "null"], description: Resolved Clerk display name, when available (falls back to short id client-side) }
        eventType: { type: string }
        summary: { type: string }
        resourceId: { type: ["string", "null"] }
        leg: { type: ["string", "null"], description: "The leg the event belongs to (SELECTS/CUT/SOUND/FINISH/THUMBNAIL); null for vault-wide events like uploads" }
        createdAt: { type: string, format: date-time }
      required: [id, actorId, actorName, eventType, summary, resourceId, leg, createdAt]
    VideoGenealogyEntry:
      type: object
      description: One version's provenance — its author, its parent in the chain, and the review decision that pinned it
      properties:
        id: { type: string }
        leg: { type: string }
        version: { type: integer }
        message: { type: string }
        createdById: { type: string }
        parentVersionId: { type: ["string", "null"] }
        parentVersion: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        submission:
          type: ["object", "null"]
          description: The review decision (if any) that pinned this version
          properties:
            status: { type: string }
            decidedById: { type: ["string", "null"] }
            decidedAt: { type: ["string", "null"], format: date-time }
          required: [status, decidedById, decidedAt]
      required: [id, leg, version, message, createdById, parentVersionId, parentVersion, createdAt, submission]
    VideoTimelineVersionDetail:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        message: { type: string }
        createdById: { type: string }
        parentVersionId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        snapshot: { type: object, additionalProperties: true }
      required: [id, version, message, createdById, parentVersionId, createdAt, snapshot]
    VideoTimelineSaveInput:
      type: object
      properties:
        snapshot: { type: object, additionalProperties: true }
        message: { type: string, maxLength: 500 }
      required: [snapshot]
    VideoTimelineRollbackInput:
      type: object
      properties:
        versionId: { type: string, minLength: 1 }
      required: [versionId]
    VideoCheckoutMediaItem:
      type: object
      properties:
        assetId: { type: string }
        fileName: { type: string }
        kind: { type: string }
        reel: { type: string }
        clipIds:
          type: array
          items: { type: string }
        firstInMs: { type: integer }
        lastOutMs: { type: integer }
        downloadPath: { type: string }
      required: [assetId, fileName, kind, reel, clipIds, firstInMs, lastOutMs, downloadPath]
    VideoCheckoutManifest:
      type: object
      properties:
        projectId: { type: string }
        leg: { type: string }
        version: { type: ["integer", "null"] }
        media:
          type: array
          items: { $ref: "#/components/schemas/VideoCheckoutMediaItem" }
      required: [projectId, leg, version, media]
    VideoTimelineImportInput:
      type: object
      description: An interchange document to re-import — `format` picks the parser (CMX3600 EDL default, FCPXML 1.9, or OpenTimelineIO Timeline.1). `media` optionally carries the rendered master / stems to land in the vault with the push (content-addressed, so unchanged files dedupe).
      properties:
        format: { type: string, enum: [EDL, FCPXML, OTIO], default: EDL }
        document: { type: string, minLength: 1 }
        message: { type: string, maxLength: 500 }
        submit: { type: boolean, default: true }
        media:
          type: array
          description: Optional rendered master / stems attached to the push
          items: { type: string, format: binary }
      required: [document]
    VideoTimelineImportMediaItem:
      type: object
      description: A media file that landed in the vault with the import
      properties:
        id: { type: string }
        fileName: { type: string }
        kind: { type: string }
        deduplicated: { type: boolean, description: True when identical bytes already existed and the stored blob was reused (Git-LFS dedupe) }
      required: [id, fileName, kind, deduplicated]
    VideoTimelineImportResponse:
      type: object
      properties:
        version: { type: integer }
        clips: { type: integer }
        submissionId: { type: ["string", "null"] }
        media:
          type: array
          items: { $ref: "#/components/schemas/VideoTimelineImportMediaItem" }
      required: [version, clips, submissionId, media]
    VideoCheckoutExportInput:
      type: object
      description: Request a background checkout bundle build for a leg
      properties:
        includeMedia:
          type: boolean
          default: false
          description: Embed the referenced originals in the zip (self-contained bundle) instead of just the interchange docs + manifest
    VideoCheckoutExportResponse:
      type: object
      description: The enqueued EXPORT_BUNDLE job
      allOf:
        - $ref: "#/components/schemas/VideoJob"
    VideoCheckoutBundleStatus:
      type: object
      description: The latest EXPORT_BUNDLE job for a leg (queue state + artifact location)
      allOf:
        - $ref: "#/components/schemas/VideoJob"
    VideoSubmission:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        leg: { type: string }
        timelineVersionId: { type: string }
        status: { type: string }
        note: { type: string }
        submittedById: { type: string }
        decidedById: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        decisionNote: { type: ["string", "null"], description: "The Captain's improvement note sent back with the decision (always set when rejecting; optional on approval)" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, leg, timelineVersionId, status, note, submittedById, decidedById, decidedAt, decisionNote, createdAt, updatedAt]
    VideoSubmissionInput:
      type: object
      properties:
        leg: { type: string, enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL] }
        note: { type: string, maxLength: 2000 }
      required: [leg]
    VideoSubmissionDecisionInput:
      type: object
      description: Optional note attached to an approve/reject decision — for a rejection it is the improvement message sent back to the submitter
      properties:
        note:
          type: string
          maxLength: 2000
          description: Improvement instructions for the submitter (required in spirit on reject, enforced in the UI)
    VideoReviewQueueItem:
      type: object
      description: One pending (SUBMITTED) leg submission on the Captain's review queue, with the project context needed to open the review surface
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        leg: { type: string }
        timelineVersionId: { type: string }
        status: { type: string }
        note: { type: string }
        submittedById: { type: string }
        submittedByName: { type: ["string", "null"], description: "Resolved Clerk display name of the submitter, when available" }
        headVersionId: { type: ["string", "null"], description: "The leg's current head version id — the diff baseline for this pull request" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, projectName, leg, timelineVersionId, status, note, submittedById, submittedByName, headVersionId, createdAt, updatedAt]
    VideoChatMessage:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        authorId: { type: string }
        body: { type: string }
        audioUrl: { type: ["string", "null"] }
        audioName: { type: ["string", "null"] }
        audioDurationMs: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, authorId, body, audioUrl, audioName, audioDurationMs, createdAt]
    VideoChatMessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
      required: [body]
    VideoChatVoiceNoteInput:
      type: object
      properties:
        audio:
          type: string
          format: binary
          description: The recorded voice note (WebM/Opus or MP4 audio blob)
        durationMs:
          type: integer
          description: Recorded duration in milliseconds
        name:
          type: string
          description: Original file name for the voice note
      required: [audio]
      description: Multipart upload of a voice note into the project crew room
    VideoComment:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        leg: { type: ["string", "null"] }
        assetId: { type: ["string", "null"] }
        timecodeMs: { type: ["integer", "null"] }
        body: { type: string }
        authorId: { type: string }
        parentId: { type: ["string", "null"] }
        geometry: { type: ["object", "null"], additionalProperties: true }
        kind: { type: string }
        color: { type: ["string", "null"] }
        label: { type: ["string", "null"] }
        submissionId: { type: ["string", "null"] }
        timelineVersionId: { type: ["string", "null"] }
        resolvedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, leg, assetId, timecodeMs, body, authorId, parentId, geometry, kind, color, label, submissionId, timelineVersionId, resolvedAt, createdAt]
    VideoCommentInput:
      type: object
      description: A timecode note or a spatial annotation (kind PIN/HIGHLIGHT/MARK carries a normalized geometry)
      properties:
        leg: { type: string, enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL] }
        assetId: { type: string }
        timecodeMs: { type: integer, minimum: 0 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        parentId: { type: string }
        kind: { type: string, enum: [TIMECODE, PIN, HIGHLIGHT, MARK], default: TIMECODE }
        geometry: { type: object, additionalProperties: true }
        color: { type: string }
        label: { type: string, maxLength: 12 }
        submissionId: { type: string }
        timelineVersionId: { type: string }
      required: [body]
    VideoCommentResolveInput:
      type: object
      properties:
        resolved: { type: boolean }
      required: [resolved]
    VideoJob:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        assetId: { type: ["string", "null"] }
        type: { type: string }
        status: { type: string }
        attempts: { type: integer }
        error: { type: ["string", "null"] }
        params: { type: ["object", "null"], additionalProperties: true }
        result: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
      required: [id, projectId, assetId, type, status, attempts, error, params, result, createdAt, startedAt, finishedAt]
    VideoSyncInput:
      type: object
      properties:
        targetAssetId: { type: string, minLength: 1 }
      required: [targetAssetId]
    VideoSync:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        primaryAssetId: { type: string }
        targetAssetId: { type: string }
        offsetMs: { type: integer }
        method: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, primaryAssetId, targetAssetId, offsetMs, method, status, createdAt, updatedAt]
    VideoRenderInput:
      type: object
      properties:
        format: { type: string, enum: [PREVIEW, PICTURE_LOCK], default: PREVIEW }
      required: [format]
    VideoAudioPassInput:
      type: object
      properties:
        action: { type: string, enum: [NOISE_REDUCTION, EQ, DUCKING, LEVELING] }
        assetId: { type: string }
      required: [action]
    VideoExportInput:
      type: object
      properties:
        formats:
          type: array
          items: { type: string, enum: ["16:9", "9:16", "1:1"] }
          minItems: 1
      required: [formats]
    VideoThumbnailInput:
      type: object
      properties:
        assetId: { type: string, minLength: 1 }
        timeMs: { type: integer, minimum: 0 }
      required: [assetId, timeMs]
    VideoDownload:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        fileId: { type: string }
        fileName: { type: string }
        memberId: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, fileId, fileName, memberId, createdAt]
    VideoReference:
      type: object
      properties:
        id: { type: string }
        assetId: { type: string }
        status: { type: string }
        pacing: { type: ["object", "null"], additionalProperties: true }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, assetId, status, pacing, error, createdAt, updatedAt]
    VideoGrant:
      type: object
      description: A timed download grant covering every file version under one or more roles (or ALL roles), not a single file.
      properties:
        id: { type: string }
        projectId: { type: string }
        roles:
          type: array
          items: { type: string }
          description: The roles whose files the member may download, e.g. ["VIDEO", "AUDIO"]; ["ALL"] covers every file in the project.
        memberId: { type: string }
        reason: { type: string }
        grantedById: { type: string }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, roles, memberId, reason, grantedById, expiresAt, revokedAt, createdAt]
    VideoGrantInput:
      type: object
      properties:
        memberId: { type: string, minLength: 1 }
        roles:
          type: array
          minItems: 1
          items: { type: string }
          description: The roles whose files the member may download — pick one or more of VIDEO, AUDIO, SCRIPT, THUMBNAIL, or ["ALL"] for every file.
        reason: { type: string, maxLength: 500 }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 24 }
      required: [memberId, roles]
    VideoNotification:
      type: object
      properties:
        id: { type: string }
        recipientId: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        deepLink: { type: string }
        resourceId: { type: ["string", "null"] }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, recipientId, category, title, body, deepLink, resourceId, readAt, createdAt]
    ArenaRole:
      type: string
      enum: [VIDEO, AUDIO, SCRIPT, THUMBNAIL]
      description: The four content roles an arena post can recruit for
    ArenaPostStatus:
      type: string
      enum: [OPEN, FILLED, CLOSED]
    ArenaApplicationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN]
    ArenaPostSummary:
      type: object
      description: An open role post as shown on the Arena board / lists
      properties:
        id: { type: string }
        channelId: { type: string }
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ArenaRole" }
        pitch: { type: string }
        status: { $ref: "#/components/schemas/ArenaPostStatus" }
        postedBy: { type: string }
        posterName: { type: string }
        posterImageUrl: { type: ["string", "null"] }
        channelName: { type: string }
        channelAvatarUrl: { type: ["string", "null"] }
        projectName: { type: string }
        projectStatus: { type: string }
        applicantCount: { type: integer, description: Live number of PENDING auditions on this post (the current applicants) }
        applicants:
          type: array
          description: Distinct creators who applied to this post, most recent application first (capped) — the avatar stack on the board cards
          items: { $ref: "#/components/schemas/ArenaHireProfile" }
        myApplication:
          type: string
          enum: [none, pending, accepted, rejected]
          description: The caller's own application state on this post
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, channelId, projectId, role, pitch, status, postedBy, posterName, posterImageUrl, channelName, channelAvatarUrl, projectName, projectStatus, applicantCount, applicants, myApplication, createdAt, updatedAt]
    ArenaHireProfile:
      type: object
      description: Public profile of the creator who filled a role — present on the post once it is FILLED
      properties:
        id: { type: string }
        name: { type: string }
        imageUrl: { type: ["string", "null"] }
      required: [id, name, imageUrl]
    ArenaPostDetail:
      allOf:
        - $ref: "#/components/schemas/ArenaPostSummary"
        - type: object
          description: Post detail (Captain view adds the total application history)
          properties:
            totalApplications:
              type: integer
              description: All applications ever received on this post (Captain only; 0 otherwise)
            filledBy:
              type: ["object", "null"]
              description: The accepted hire's public profile once the post is FILLED; null while it is OPEN or CLOSED
              allOf:
                - $ref: "#/components/schemas/ArenaHireProfile"
          required: [totalApplications, filledBy]
    ArenaPostInput:
      type: object
      description: Publish an open role on one of the Captain's channel projects
      properties:
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ArenaRole" }
        pitch:
          type: string
          minLength: 10
          maxLength: 2000
      required: [projectId, role, pitch]
    ArenaPostUpdate:
      type: object
      description: Close/reopen a post or edit its pitch while OPEN (Captain only)
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]
        pitch:
          type: string
          minLength: 10
          maxLength: 2000
    ArenaApplicationFile:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, fileName, mimeType, sizeBytes, createdAt]
    ArenaApplication:
      type: object
      properties:
        id: { type: string }
        postId: { type: string }
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ArenaRole" }
        applicantId: { type: string }
        applicantName: { type: ["string", "null"] }
        applicantImageUrl: { type: ["string", "null"] }
        message: { type: string }
        status: { $ref: "#/components/schemas/ArenaApplicationStatus" }
        decidedBy: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        files:
          type: array
          items: { $ref: "#/components/schemas/ArenaApplicationFile" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, postId, projectId, role, applicantId, applicantName, applicantImageUrl, message, status, decidedBy, decidedAt, files, createdAt, updatedAt]
    ArenaApplicationInput:
      type: object
      description: Multipart audition — a message plus up to 3 supporting documents
      properties:
        message:
          type: string
          minLength: 20
          maxLength: 2000
        files:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
      required: [message]
    ArenaReviewInput:
      type: object
      description: A mutual work review between the Captain and the hired applicant
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        note:
          type: string
          maxLength: 500
      required: [rating, note]
    ArenaReview:
      type: object
      description: A mutual work review between the Captain and the hired applicant
      properties:
        id: { type: string }
        applicationId: { type: string }
        projectId: { type: string }
        role: { $ref: "#/components/schemas/ArenaRole" }
        reviewerId: { type: string }
        reviewerName: { type: ["string", "null"] }
        reviewerImageUrl: { type: ["string", "null"] }
        revieweeId: { type: string }
        rating: { type: integer }
        note: { type: string }
        projectName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, applicationId, projectId, role, reviewerId, reviewerName, reviewerImageUrl, revieweeId, rating, note, projectName, createdAt]
    ArenaWatchInput:
      type: object
      description: Watch a role — across the whole Arena, or scoped to one channel
      properties:
        role: { $ref: "#/components/schemas/ArenaRole" }
        channelId: { type: string }
      required: [role]
    ArenaWatch:
      type: object
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/ArenaRole" }
        channelId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, role, channelId, createdAt, updatedAt]