              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Post not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/posts/{postId}/applications:
    post:
      operationId: createArenaApplication
      tags: [arena]
      summary: Audition for an open role (message + up to 3 documents)
      description: Multipart. One PENDING audition per user per post; the per-week apply cap and per-Captain blocks are enforced server-side.
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ArenaApplicationInput" }
      responses:
        "201":
          description: Audition submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaApplication" }
        "400":
          description: Invalid application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Own post, already a member, or blocked by this Captain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Post not found or not OPEN
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already auditioning for this post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Per-week application cap reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listArenaPostApplications
      tags: [arena]
      summary: List the auditions on a post (Captain only)
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Auditions (any status, newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaApplication" }
        "403":
          description: Not the Captain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Post not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/mine:
    get:
      operationId: listMyArenaApplications
      tags: [arena]
      summary: List the caller's own auditions (My Auditions)
      responses:
        "200":
          description: The caller's applications across every post
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaApplication" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}:
    get:
      operationId: getArenaApplication
      tags: [arena]
      summary: Read one audition (the applicant themself or the Captain)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Audition detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaApplication" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: acceptArenaApplication
      tags: [arena]
      summary: Accept an audition (Captain only)
      description: Transactionally marks the application ACCEPTED, fills the post, adds the applicant as a member holding the role, and auto-declines the remaining PENDING auditions.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Accepted audition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaApplication" }
        "403":
          description: Not the Captain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application is not PENDING or the post already filled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}/reject:
    post:
      operationId: rejectArenaApplication
      tags: [arena]
      summary: Reject an audition (Captain only)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Rejected audition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaApplication" }
        "403":
          description: Not the Captain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application is not PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}/withdraw:
    post:
      operationId: withdrawArenaApplication
      tags: [arena]
      summary: Withdraw a PENDING audition (applicant only)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Withdrawn audition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaApplication" }
        "403":
          description: Not the applicant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application is not PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}/review:
    post:
      operationId: createArenaApplicationReview
      tags: [arena]
      summary: Leave a mutual work review after a hire
      description: Only the two participants of an ACCEPTED application, once each per hire. The Captain may review the hired applicant and the applicant may review the Captain.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaReviewInput" }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaReview" }
        "400":
          description: Invalid review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not a participant of an ACCEPTED hire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already reviewed this hire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}/block:
    post:
      operationId: blockArenaApplicant
      tags: [arena]
      summary: Block an applicant from all of this Captain's posts
      description: Per-Captain anti-spam block. Does not change any existing application status; the blocked user gets 403 when applying to this Captain's posts.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Blocked
        "403":
          description: Not the Captain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Application not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/applications/{applicationId}/files/{fileId}:
    get:
      operationId: getArenaApplicationFile
      tags: [arena]
      summary: Stream a stored audition document
      description: Returns the document bytes. Applicant or Captain only.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: fileId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The document bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: File not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/reviews:
    get:
      operationId: listArenaReviews
      tags: [arena]
      summary: Read the public work reviews a profile has received
      description: Received reviews (rating + note + role + project context) are public profile data — the reputation surface of the Arena. Any signed-in creator can read the reviews a reviewee has received.
      parameters:
        - name: userId
          in: query
          required: true
          description: The reviewee whose received reviews to list
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Received reviews, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaReview" }
        "400":
          description: Missing reviewee id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/watches:
    get:
      operationId: listArenaWatches
      tags: [arena]
      summary: List the caller's role watches
      responses:
        "200":
          description: The caller's watches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaWatch" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createArenaWatch
      tags: [arena]
      summary: Watch a role (optionally on one channel)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaWatchInput" }
      responses:
        "201":
          description: Created watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaWatch" }
        "400":
          description: Invalid watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already watching that role (and channel)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /video/arena/watches/{watchId}:
    delete:
      operationId: deleteArenaWatch
      tags: [arena]
      summary: Stop watching (own watch only)
      parameters:
        - name: watchId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Deleted
        "403":
          description: Not the watcher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Watch not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  parameters:
    SeedId:
      name: seedId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ContinuationId:
      name: continuationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GenreQuery:
      name: genre
      in: query
      required: false
      schema: { type: string }
    UnitQuery:
      name: unit
      in: query
      required: false
      schema: { type: string }
    LanguageQuery:
      name: language
      in: query
      required: false
      schema: { type: string }
    ProtocolQuery:
      name: protocol
      in: query
      required: false
      schema: { type: string }
    AvailabilityQuery:
      name: availability
      in: query
      required: false
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        enum: [groq, openrouter, ollama, lmstudio, freebuff]
    VideoProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Creator Den workspace channel id
      schema: { type: string, minLength: 1 }
    VideoUserId:
      name: userId
      in: path
      required: true
      description: Clerk user id whose public track history to read
      schema: { type: string, minLength: 1 }
    VideoRowId:
      name: videoRowId
      in: path
      required: true
      description: The tandem_channel_videos row id (chanvid_…) of a catalog video
      schema: { type: string, minLength: 1 }
    VideoActivityLegQuery:
      name: leg
      in: query
      required: false
      description: Optional leg (stage) filter — returns only that leg's events
      schema:
        type: string
        enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL]
    VideoAssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoFileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoMemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoGrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoNotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoLeg:
      name: leg
      in: path
      required: true
      schema: { type: string, enum: [SELECTS, CUT, SOUND, FINISH, THUMBNAIL] }
    VideoSubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    VideoCommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    CollaborationSeed:
      type: object
      properties:
        id: { type: string }
        creatorId: { type: string }
        creatorName: { type: string }
        sourceProjectId: { type: string }
        sourceProjectTitle: { type: string }
        sourceSceneId: { type: ["string", "null"] }
        sourceVersion: { type: integer }
        seedText: { type: string }
        unitType: { type: string }
        protocol: { type: string }
        genre: { type: string }
        tone: { type: string }
        language: { type: string }
        plotConstraints: { type: string }
        desiredRole: { type: string }
        visibility: { type: string }
        respondentLimit: { type: integer }
        respondentCount: { type: integer }
        myApplicationId: { type: ["string", "null"] }
        myApplicationStatus: { type: ["string", "null"] }
        availability: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, creatorId, creatorName, sourceProjectId, sourceProjectTitle, sourceSceneId, sourceVersion, seedText, unitType, protocol, genre, tone, language, plotConstraints, desiredRole, visibility, respondentLimit, respondentCount, myApplicationId, myApplicationStatus, availability, publishedAt, createdAt]
    CollaborationSeedInput:
      type: object
      properties:
        sourceProjectId: { type: string, minLength: 1 }
        sourceProjectTitle: { type: string, minLength: 1 }
        # Display name of the creator at publish time (optional; falls back to “Author”).
        creatorName: { type: string }
        sourceSceneId: { type: ["string", "null"] }
        sourceVersion: { type: integer, minimum: 1 }
        seedText: { type: string, minLength: 1, maxLength: 12000 }
        unitType: { type: string, minLength: 1 }
        protocol: { type: string, minLength: 1 }
        genre: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        plotConstraints: { type: string }
        desiredRole: { type: string, minLength: 1 }
        visibility: { type: string, enum: [SEED_AND_BRIEF, SEED_ONLY] }
        respondentLimit: { type: integer, enum: [3, 5, 10, 0] }
        # The full Author Den project snapshot this seed was frozen from.
        # Respondents fork this document when they answer; the creator merges
        # against it when accepting a fork.
        projectDocument: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [sourceProjectId, sourceProjectTitle, seedText, unitType, protocol, genre, tone, language, plotConstraints, desiredRole, visibility, respondentLimit]
    CollaborationSeedUpdate:
      type: object
      properties:
        unitType: { type: string, minLength: 1 }
        protocol: { type: string, minLength: 1 }
        genre: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
        language: { type: string, minLength: 1 }
        plotConstraints: { type: string }
        desiredRole: { type: string, minLength: 1 }
        visibility: { type: string, enum: [SEED_AND_BRIEF, SEED_ONLY] }
        respondentLimit: { type: integer, enum: [3, 5, 10, 0] }
    SeedApplicationInput:
      type: object
      properties:
        respondentName: { type: string, minLength: 1 }
      required: [respondentName]
    SeedApplication:
      type: object
      properties:
        id: { type: string }
        seedId: { type: string }
        respondentId: { type: string }
        respondentName: { type: string }
        sourceProjectTitle: { type: string }
        sourceSeedText: { type: string }
        draftText: { type: string }
        draftComments: { type: string }
        status: { type: string }
        submittedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, seedId, respondentId, respondentName, sourceProjectTitle, sourceSeedText, draftText, draftComments, status, submittedAt, createdAt, updatedAt]
    ContinuationDraftInput:
      type: object
      properties:
        draftText: { type: string, maxLength: 20000 }
        draftComments: { type: string, maxLength: 6000 }
        # The respondent's working fork of the seed project, saved as they
        # edit and carried into the submission for the creator's preview.
        projectDocument: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [draftText, draftComments]
    AuthorProjectDocument:
      type: object
      additionalProperties: true
      description: A serialized Author Den project (title, scenes, characters, plots, world).
    ProjectDocument:
      type: object
      properties:
        document: { $ref: "#/components/schemas/AuthorProjectDocument" }
        updatedAt: { type: ["string", "null"], format: date-time }
      required: [document, updatedAt]
    SaveCollaborationProjectDocumentInput:
      type: object
      properties:
        document: { $ref: "#/components/schemas/AuthorProjectDocument" }
      required: [document]
    ContinuationSubmission:
      type: object
      properties:
        id: { type: string }
        applicationId: { type: string }
        seedId: { type: string }
        creatorId: { type: string }
        respondentId: { type: string }
        respondentName: { type: string }
        sourceProjectTitle: { type: string }
        seedText: { type: string }
        continuationText: { type: string }
        comments: { type: string }
        notificationId: { type: ["string", "null"] }
        read: { type: boolean }
        status: { type: string }
        submittedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, applicationId, seedId, creatorId, respondentId, respondentName, sourceProjectTitle, seedText, continuationText, comments, notificationId, read, status, submittedAt, createdAt]
    WriterProfile:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        bio: { type: string }
        genres:
          type: array
          items: { type: string }
        tones:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        submittedCount: { type: integer }
        acceptedCount: { type: integer }
        completedCount: { type: integer }
      required: [userId, displayName, bio, genres, tones, languages, submittedCount, acceptedCount, completedCount]
    AdvisorySignal:
      type: object
      properties:
        category: { type: string }
        level: { type: string, enum: [positive, neutral, attention] }
        title: { type: string }
        detail: { type: string }
      required: [category, level, title, detail]
    ContinuationAdvisory:
      type: object
      properties:
        disclaimer: { type: string }
        signals:
          type: array
          items: { $ref: "#/components/schemas/AdvisorySignal" }
        source: { type: string, enum: [oracle, local] }
        available: { type: boolean }
        providerId: { type: ["string", "null"] }
        modelId: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        generatedAt: { type: string, format: date-time }
      required: [disclaimer, signals, source, available, providerId, modelId, note, generatedAt]
    CollaborationMessage:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        body: { type: string }
        audioUrl: { type: ["string", "null"] }
        audioName: { type: ["string", "null"] }
        audioDurationMs: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, threadId, senderId, body, createdAt]
    CollaborationVoiceNoteInput:
      type: object
      description: Multipart voice note for a collaboration thread
      properties:
        audio:
          type: string
          format: binary
        durationMs:
          type: integer
      required: [audio]
    ExploreAuthor:
      type: object
      description: An author discoverable in the Author Den explore list (someone with published seeds)
      properties:
        userId: { type: string }
        displayName: { type: string }
        imageUrl: { type: ["string", "null"] }
        publishedSeedCount: { type: integer }
        followerCount: { type: integer }
        isFollowing: { type: ["boolean", "null"] }
      required: [userId, displayName, imageUrl, publishedSeedCount, followerCount, isFollowing]
    CollaborationThread:
      type: object
      properties:
        id: { type: string }
        continuationId: { type: string }
        creatorId: { type: string }
        respondentId: { type: string }
        projectId: { type: ["string", "null"] }
        creatorName: { type: string }
        respondentName: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/CollaborationMessage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, continuationId, creatorId, respondentId, projectId, creatorName, respondentName, messages, createdAt, updatedAt]
    ThreadUnread:
      type: object
      properties:
        unread: { type: boolean }
        count: { type: integer }
      required: [unread, count]
    InboxThread:
      type: object
      properties:
        id: { type: string }
        continuationId: { type: string }
        projectId: { type: ["string", "null"] }
        seedId: { type: ["string", "null"] }
        sourceProjectTitle: { type: string }
        partnerId: { type: string }
        partnerName: { type: string }
        lastMessage: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"] }
        messageCount: { type: integer }
