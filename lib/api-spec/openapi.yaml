openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Manuskript authoring and Story Oracle API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Category launch notification signups
  - name: admin
    description: Private Story Oracle administration
  - name: oracle
    description: Story Oracle requests
  - name: collaborations
    description: Author-to-author collaboration seeds, applications, and review
  - name: tandems
    description: Shared collaboration projects and contract state
  - name: users
    description: Public profile lookups for collaborators
  - name: content-creators
    description: Pre-recorded video production projects (the 4-leg relay)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    get:
      operationId: listWaitlistEntries
      tags: [waitlist]
      summary: List the authenticated user's category waitlists
      description: Returns the category launch notifications the authenticated user has joined.
      responses:
        "200":
          description: The user's waitlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaitlistEntry"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWaitlistEntry
      tags: [waitlist]
      summary: Join a category launch waitlist
      description: Adds the authenticated user to the notification list for a category that is not yet available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Waitlist entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "409":
          description: The user is already on this category waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check private admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Start a private admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid access code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End a private admin session
      responses:
        "204":
          description: Logged out
  /admin/providers:
    get:
      operationId: listAdminProviders
      tags: [admin]
      summary: List provider and model health without secrets
      responses:
        "200":
          description: Provider status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderStatus"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/providers/{providerId}:
    put:
      operationId: updateAdminProvider
      tags: [admin]
      summary: Save provider credentials and routing options
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "400":
          description: Invalid provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/providers/{providerId}/check:
    post:
      operationId: checkAdminProvider
      tags: [admin]
      summary: Test provider connectivity
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Provider health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/chat:
    post:
      operationId: oracleChat
      tags: [oracle]
      summary: Ask the Story Oracle with automatic provider failover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OracleChatInput"
      responses:
        "200":
          description: Oracle response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OracleResult"
        "400":
          description: Invalid Oracle request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/continuity:
    post:
      operationId: continuityAudit
      tags: [oracle]
      summary: Audit selected project material for continuity conflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityAuditInput"
      responses:
        "200":
          description: Continuity findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityAuditResult"
        "400":
          description: Invalid continuity request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/rewrite:
    post:
      operationId: toneRewrite
      tags: [oracle]
      summary: Rewrite selected text to match a bounded voice reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToneRewriteInput"
      responses:
        "200":
          description: Rewritten text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToneRewriteResult"
        "400":
          description: Invalid rewrite request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/outline:
    post:
      operationId: outlineAssist
      tags: [oracle]
      summary: Generate bounded premise, scene, or pacing assistance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineAssistInput"
      responses:
        "200":
          description: Outline assistance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutlineAssistResult"
        "400":
          description: Invalid outline request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/voice:
    post:
      operationId: voiceConsistencyCheck
      tags: [oracle]
      summary: Check a character's voice across selected scenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceConsistencyInput"
      responses:
        "200":
          description: Character voice consistency report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceConsistencyResult"
        "400":
          description: Invalid voice consistency request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /oracle/world-bible:
    post:
      operationId: worldBibleExtract
      tags: [oracle]
      summary: Extract locations, items, and world rules from selected project material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldBibleExtractInput"
      responses:
        "200":
          description: Extracted world bible entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldBibleExtractResult"
        "400":
          description: Invalid world bible request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured provider is currently available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /collaborations/seeds:
    get:
      operationId: listCollaborationSeeds
      tags: [collaborations]
      summary: List discoverable collaboration seeds
      parameters:
        - { $ref: "#/components/parameters/GenreQuery" }
        - { $ref: "#/components/parameters/UnitQuery" }
        - { $ref: "#/components/parameters/LanguageQuery" }
        - { $ref: "#/components/parameters/ProtocolQuery" }
        - { $ref: "#/components/parameters/AvailabilityQuery" }
      responses:
        "200":
          description: Open seeds visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollaborationSeed" }
    post:
      operationId: createCollaborationSeed
      tags: [collaborations]
      summary: Publish a frozen writing seed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationSeedInput" }
      responses:
        "201":
          description: Published seed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationSeed" }
        "400":
          description: Invalid seed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/seeds/{seedId}:
    get:
      operationId: getCollaborationSeed
      tags: [collaborations]
      summary: Read a permitted seed snapshot
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      responses:
        "200":
          description: Seed detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationSeed" }
        "404":
          description: Seed not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateCollaborationSeed
      tags: [collaborations]
      summary: Update an unpublished creator-owned seed
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationSeedUpdate" }
      responses:
        "200":
          description: Updated seed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationSeed" }
        "400":
          description: Invalid update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: closeCollaborationSeed
      tags: [collaborations]
      summary: Close a creator-owned seed
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      responses:
        "204": { description: Seed closed }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/seeds/{seedId}/project:
    get:
      operationId: getCollaborationSeedProject
      tags: [collaborations]
      summary: Read the frozen Author Den project behind a seed
      description: The creator or any active respondent can fetch the full project snapshot this seed was published from, so answers can fork it in their own studio.
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      responses:
        "200":
          description: Frozen project document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorProjectDocument" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Seed has no project snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/seeds/{seedId}/applications:
    post:
      operationId: createSeedApplication
      tags: [collaborations]
      summary: Create a respondent-owned continuation clone
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedApplicationInput" }
      responses:
        "201":
          description: Continuation application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedApplication" }
        "400":
          description: Invalid application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Application already exists or seed is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/applications/{applicationId}:
    get:
      operationId: getSeedApplication
      tags: [collaborations]
      summary: Read a permitted continuation application
      parameters:
        - { $ref: "#/components/parameters/ApplicationId" }
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedApplication" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: saveSeedApplicationDraft
      tags: [collaborations]
      summary: Save a respondent continuation draft
      parameters:
        - { $ref: "#/components/parameters/ApplicationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContinuationDraftInput" }
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedApplication" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Draft is locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/applications/{applicationId}/advisory:
    post:
      operationId: createApplicationAdvisory
      tags: [collaborations]
      summary: Run an optional pre-submit advisory check on the respondent's own draft
      description: Advisory only. Running a check never blocks or changes submission.
      parameters:
        - { $ref: "#/components/parameters/ApplicationId" }
      responses:
        "200":
          description: Advisory observations for the current draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinuationAdvisory" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Draft is empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/applications/{applicationId}/submit:
    post:
      operationId: submitSeedApplication
      tags: [collaborations]
      summary: Lock and submit an immutable continuation version
      parameters:
        - { $ref: "#/components/parameters/ApplicationId" }
      responses:
        "200":
          description: Immutable submitted continuation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinuationSubmission" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already submitted or seed is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations:
    get:
      operationId: listContinuations
      tags: [collaborations]
      summary: List submitted continuations for the authenticated creator
      responses:
        "200":
          description: Creator continuation inbox
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContinuationSubmission" }
  /collaborations/continuations/{continuationId}:
    get:
      operationId: getContinuation
      tags: [collaborations]
      summary: Open a selection-room continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Continuation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinuationSubmission" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/project:
    get:
      operationId: getContinuationProject
      tags: [collaborations]
      summary: Read the submitted project fork for a read-only preview
      description: The seed creator opens this to preview the respondent's submitted project in their own Author Den without importing it. Read-only by design.
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Submitted project document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorProjectDocument" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Submission carries no project snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/profile:
    get:
      operationId: getContinuationWriterProfile
      tags: [collaborations]
      summary: Read the permitted profile and collaboration statistics for a respondent
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Respondent profile and safe statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriterProfile" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/advisory:
    get:
      operationId: getContinuationAdvisory
      tags: [collaborations]
      summary: Read advisory compatibility observations for a continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Advisory observations that never decide selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinuationAdvisory" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/annotations:
    get:
      operationId: listContinuationAnnotations
      tags: [collaborations]
      summary: List stable-range annotations on a submitted continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Annotations anchored to plain-text ranges of the immutable submission
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollaborationAnnotation" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createContinuationAnnotation
      tags: [collaborations]
      summary: Add a stable-range annotation to a submitted continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollaborationAnnotationInput" }
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationAnnotation" }
        "400":
          description: Invalid range or body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/thread:
    get:
      operationId: getContinuationThread
      tags: [collaborations]
      summary: Read the private message thread for a continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Private continuation thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationThread" }
        "404":
          description: No thread exists yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: startContinuationThread
      tags: [collaborations]
      summary: Start or reopen the private message thread for a continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "201":
          description: Private continuation thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationThread" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: declineContinuation
      tags: [collaborations]
      summary: Decline and archive a submitted continuation
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "204": { description: Continuation archived }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/accept:
    post:
      operationId: acceptContinuation
      tags: [collaborations]
      summary: Accept a submission as a collaborator and merge its fork
      description: The creator approves the submitted fork. The seed project and the submitted fork are merged into a shared document that both authors keep in sync in their Author Den studios.
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Shared project created with the merged document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationProject" }
        "403":
          description: Not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Continuation is no longer available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/continuations/{continuationId}/select:
    post:
      operationId: selectContinuation
      tags: [collaborations]
      summary: Select a continuation and open a contract
      parameters:
        - { $ref: "#/components/parameters/ContinuationId" }
      responses:
        "200":
          description: Contract preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationProject" }
        "409":
          description: Seed already selected or continuation unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/seeds/{seedId}/selection:
    get:
      operationId: getSeedSelection
      tags: [collaborations]
      summary: Read the creator's submitted continuation pool for a seed
      parameters:
        - { $ref: "#/components/parameters/SeedId" }
      responses:
        "200":
          description: Submitted continuations available to the seed creator
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContinuationSubmission" }
        "403":
          description: Only the seed creator can open the selection room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /collaborations/threads/{threadId}:
    get:
      operationId: getCollaborationThread
      tags: [collaborations]
      summary: Read a participant-scoped collaboration thread
      parameters:
        - { $ref: "#/components/parameters/ThreadId" }
      responses:
        "200":
          description: Private collaboration thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationThread" }
        "403":
          description: Not allowed
          content:
            application/json:
