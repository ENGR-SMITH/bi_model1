kind = "web"
previewPath = "/authors-den/"
title = "Authors Den"
description = "The original Authors Den writing studio, preserved as a separate experience and linked from Tandem's Authors & Writers room."
version = "1.0.0"
id = "artifacts/authors-den"
router = "path"

[[services]]
name = "web"
paths = [ "/authors-den/" ]
localPort = 21223

[services.development]
run = "pnpm --filter @workspace/authors-den run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/authors-den", "run", "build" ]
serve = "static"
publicDir = "artifacts/authors-den/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21223"
BASE_PATH = "/authors-den/"
