# One-container router: serves the four built SPAs and proxies the API +
# Socket.IO to the Node server on 127.0.0.1:3000. See DEPLOYMENT.md §1/§4.
# Installed as /etc/nginx/conf.d/default.conf (inside the http block), so
# http-context directives like `map` are legal here.

# Uploads go straight through to Node (multer allows up to 10 GB; the UI caps
# browser uploads at 500 MB). nginx's default limit is 1 MB — lift it entirely.
client_max_body_size 0;

# (No gzip block here: the Debian nginx package enables it in the main
# nginx.conf, and Render compresses responses at the edge anyway.)

# Allow Socket.IO's WebSocket upgrade while keeping regular requests clean.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  root /srv/nexet/root;   # Nexet build (BASE_PATH=/)
  index index.html;

  # The three sub-apps must keep their trailing slash (Vite base paths).
  location = /authors-den  { return 301 /authors-den/; }
  location = /creators-den { return 301 /creators-den/; }
  location = /oracle-admin { return 301 /oracle-admin/; }

  # API (REST + Clerk proxy) → Node. Stream large upload bodies straight
  # through instead of buffering them to disk first.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  # Socket.IO realtime → Node (WebSocket upgrade).
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Desktop-agent release feed (latest.yml / latest-mac.yml + installers +
  # blockmaps). The include is written at container start by entrypoint.sh: it
  # redirects to the published R2 feed when DESKTOP_AGENT_FEED_URL is set, and
  # otherwise hands the path to Node. Either way it must not fall through to
  # the SPA fallback below — electron-updater would get index.html with a 200
  # and fail to parse it as YAML on every update check.
  include /etc/nginx/desktop-agent.conf;

  # The three sub-apps, each with SPA fallback to its own index.html.
  location /authors-den/  { alias /srv/nexet/authors-den/;  try_files $uri $uri/ /authors-den/index.html; }
  location /creators-den/ { alias /srv/nexet/creators-den/; try_files $uri $uri/ /creators-den/index.html; }
  location /oracle-admin/ { alias /srv/nexet/oracle-admin/; try_files $uri $uri/ /oracle-admin/index.html; }

  # Nexet SPA fallback (everything else).
  location / {
    try_files $uri $uri/ /index.html;
  }
}