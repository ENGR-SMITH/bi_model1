kind = "web"
previewPath = "/"
title = "Tandem"
description = "The Tandem creative collaboration house, with the Authors & Writers room connected to the separate Authors Den writing studio."
version = "1.0.0"
id = "artifacts/tandem"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22852

[services.development]
run = "pnpm --filter @workspace/tandem run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tandem", "run", "build" ]
serve = "static"
publicDir = "artifacts/tandem/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22852"
BASE_PATH = "/"
