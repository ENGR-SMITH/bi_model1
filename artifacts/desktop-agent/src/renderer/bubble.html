<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem widget</title>
    <style>
      :root {
        --accent: #e6150a;
        --accent-2: #ff5f4d;
        --accent-deep: #8f0c02;
      }
      * { box-sizing: border-box; margin: 0; user-select: none; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 100vw; height: 100vh; }

      /* The whole circle is the drag handle (frameless window needs an
         -webkit-app-region: drag surface to be movable). */
      .bubble {
        -webkit-app-region: drag;
        position: absolute; inset: 0;
        display: grid; place-items: center;
        cursor: default;
      }

      /* The sphere itself. Layered gradients fake a glossy orb: a soft
         highlight, then the brand red body fading darker toward the rim,
         finished with a bright rim + outer glow (kept inside the window). */
      .bubble::after {
        content: "";
        position: absolute; inset: 4px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 31% 24%, rgba(255, 255, 255, 0.35), transparent 24%),
          radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 48%, var(--accent-deep) 96%);
        box-shadow:
          0 8px 22px rgba(230, 21, 10, 0.45),
          0 2px 5px rgba(0, 0, 0, 0.35),
          inset 0 1px 1px rgba(255, 255, 255, 0.4),
          inset 0 -2px 5px rgba(0, 0, 0, 0.22);
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .bubble:hover::after { transform: scale(1.05); filter: brightness(1.06); }
      .bubble:active::after { transform: scale(0.98); }

      /* Clickable core — marked no-drag so clicks reach it. */
      .core {
        -webkit-app-region: no-drag;
        position: relative; z-index: 2;
        width: 40px; height: 40px; border-radius: 50%;
        display: grid; place-items: center;
        color: #fff; cursor: pointer;
        font: italic 700 19px/1 "DM Sans", system-ui, -apple-system, sans-serif;
        text-shadow:
          0 1px 2px rgba(60, 0, 0, 0.65),
          0 0 12px rgba(255, 255, 255, 0.25);
        transition: transform 0.1s ease;
      }
      .core:hover { transform: scale(1.08); }
      .core:active { transform: scale(0.92); }

      /* Close affordance, revealed (and animated in) on hover. */
      .close {
        -webkit-app-region: no-drag;
        position: absolute; z-index: 3;
        top: 3px; right: 3px;
        width: 20px; height: 20px; border-radius: 50%;
        background: rgba(12, 12, 14, 0.82);
        color: #fff; cursor: pointer;
        display: grid; place-items: center;
        font: 600 11px/1 system-ui, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.4);
        opacity: 0; visibility: hidden; transform: scale(0.5);
        transition: opacity 0.16s ease, transform 0.16s ease, background 0.15s ease, visibility 0.16s;
      }
      .bubble:hover .close { opacity: 1; visibility: visible; transform: scale(1); }
      .close:hover {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.65);
        box-shadow: 0 0 10px rgba(230, 21, 10, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="bubble" id="bubble">
      <div class="core" id="core" title="Open Tandem Desktop Agent">T</div>
      <button class="close" id="close" title="Hide widget" aria-label="Hide widget">✕</button>
    </div>
    <script src="./bubble.js"></script>
  </body>
</html>
