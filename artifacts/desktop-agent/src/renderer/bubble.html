<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem widget</title>
    <style>
      :root {
        --accent: #e6150a;
        --accent-2: #ff5f4d;
        --accent-deep: #8f0c02;
      }
      * { box-sizing: border-box; margin: 0; user-select: none; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 100vw; height: 100vh; }

      /* The whole circle is the drag handle (frameless window needs an
         -webkit-app-region: drag surface to be movable). */
      .bubble {
        -webkit-app-region: drag;
        position: absolute; inset: 0;
        display: grid; place-items: center;
        cursor: default;
      }

      /* The sphere itself. Layered gradients fake a compact glossy orb: a
         small highlight, the brand red body fading darker toward the rim,
         and a tight drop shadow — sized for the smaller 56px bubble. */
      .bubble::after {
        content: "";
        position: absolute; inset: 2px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 25%, rgba(255, 255, 255, 0.38), transparent 26%),
          radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 52%, var(--accent-deep) 98%);
        box-shadow:
          0 4px 12px rgba(230, 21, 10, 0.4),
          0 1px 3px rgba(0, 0, 0, 0.3),
          inset 0 1px 1px rgba(255, 255, 255, 0.35),
          inset 0 -1px 3px rgba(0, 0, 0, 0.18);
        transition: transform 0.14s ease, filter 0.14s ease;
      }
      .bubble:hover::after { transform: scale(1.06); filter: brightness(1.07); }
      .bubble:active::after { transform: scale(0.96); }

      /* Clickable core — marked no-drag so clicks reach it. */
      .core {
        -webkit-app-region: no-drag;
        position: relative; z-index: 2;
        width: 24px; height: 24px; border-radius: 50%;
        display: grid; place-items: center;
        color: #fff; cursor: pointer;
        font: italic 700 13px/1 "DM Sans", system-ui, -apple-system, sans-serif;
        text-shadow:
          0 1px 1px rgba(60, 0, 0, 0.6),
          0 0 8px rgba(255, 255, 255, 0.2);
        transition: transform 0.1s ease;
      }
      .core:hover { transform: scale(1.08); }
      .core:active { transform: scale(0.92); }

      /* Close affordance, revealed (and animated in) on hover. Small enough
         to sit on the rim of the compact orb without covering it. */
      .close {
        -webkit-app-region: no-drag;
        position: absolute; z-index: 3;
        top: 0; right: 0;
        width: 15px; height: 15px; border-radius: 50%;
        background: rgba(12, 12, 14, 0.85);
        color: #fff; cursor: pointer;
        display: grid; place-items: center;
        font: 600 8px/1 system-ui, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.5);
        opacity: 0; visibility: hidden; transform: scale(0.5);
        transition: opacity 0.16s ease, transform 0.16s ease, background 0.15s ease, visibility 0.16s;
      }
      .bubble:hover .close { opacity: 1; visibility: visible; transform: scale(1); }
      .close:hover {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.7);
        box-shadow: 0 0 8px rgba(230, 21, 10, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="bubble" id="bubble">
      <div class="core" id="core" title="Open Tandem Desktop Agent">T</div>
      <button class="close" id="close" title="Hide widget" aria-label="Hide widget">✕</button>
    </div>
    <script src="./bubble.js"></script>
  </body>
</html>
