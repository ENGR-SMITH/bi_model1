<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up to Tandem</title>
    <style>
      :root {
        --bg: hsl(0 0% 7%);
        --fg: hsl(0 0% 95%);
        --border: hsl(0 0% 20%);
        --card: hsl(0 0% 11%);
        --muted-fg: hsl(0 0% 72%);
        --accent: hsl(357 92% 47%);
        --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; }
      .brand-mark {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1.5px solid var(--accent); color: var(--accent);
        display: grid; place-items: center;
        font: 700 14px var(--font-sans); font-style: italic;
      }
      .brand-name { font: 700 15px/1 var(--font-sans); letter-spacing: -.02em; }
      #signin-root {
        width: 100%; max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        min-height: 420px;
      }
      #signin-state { color: var(--muted-fg); font-size: 13px; text-align: center; padding: 40px 12px; }
      #signin-state.err { color: hsl(0 72% 60%); }
      .hidden { display: none !important; }

      /* Success panel shown once the app confirms the sign-in. */
      #signedin { text-align: center; padding: 46px 16px; }
      #signedin .check {
        width: 46px; height: 46px; margin: 0 auto 16px;
        border-radius: 50%; background: hsl(164 33% 45% / .15);
        border: 1.5px solid hsl(164 33% 45%);
        color: hsl(164 33% 60%);
        display: grid; place-items: center;
        font-size: 22px; font-weight: 700;
      }
      #signedin h2 { font: 700 18px/1.2 var(--font-sans); margin-bottom: 8px; }
      #signedin p { color: var(--muted-fg); font-size: 13px; line-height: 1.7; max-width: 30ch; margin: 0 auto; }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        animation: spin .8s linear infinite;
        margin: 0 auto 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <span class="brand-mark">T</span>
        <span class="brand-name">Tandem Desktop Agent</span>
      <span id="page-hint" style="color:var(--muted-fg);font-size:11px;margin-left:10px;">Sign up or sign in to continue in the app</span>
      </div>
      <div id="signin-root">
        <div id="signin-state">
          <div class="spinner"></div>
          Loading sign-in…
        </div>
      </div>
      <div id="signedin" class="hidden">
        <div class="check">✓</div>
        <h2>You're signed in</h2>
        <p>Return to Tandem Desktop Agent — you can close this tab.</p>
      </div>
    </div>
    <script src="./signin.js"></script>
  </body>
</html>
