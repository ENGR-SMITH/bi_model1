<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Tandem</title>
    <style>
      :root {
        --bg: hsl(0 0% 7%);
        --fg: hsl(0 0% 95%);
        --border: hsl(0 0% 20%);
        --card: hsl(0 0% 11%);
        --muted-fg: hsl(0 0% 72%);
        --accent: hsl(357 92% 47%);
        --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 18px; }
      .brand-mark {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1.5px solid var(--accent); color: var(--accent);
        display: grid; place-items: center;
        font: 700 14px var(--font-sans); font-style: italic;
      }
      .brand-name { font: 700 15px/1 var(--font-sans); letter-spacing: -.02em; }
      #signin-root {
        width: 100%; max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        min-height: 420px;
      }
      #signin-state { color: var(--muted-fg); font-size: 13px; text-align: center; padding: 40px 12px; }
      #signin-state.err { color: hsl(0 72% 60%); }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        animation: spin .8s linear infinite;
        margin: 0 auto 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <span class="brand-mark">T</span>
        <span class="brand-name">Tandem Desktop Agent</span>
      </div>
      <div id="signin-root">
        <div id="signin-state">
          <div class="spinner"></div>
          Loading sign-in…
        </div>
      </div>
    </div>
    <script src="./signin.js"></script>
  </body>
</html>
